    if (info.date) {
      const c0 = info.client ? mid + 1 : 1;
      if (c0 <= N) { mergeRow(r, c0, N); Object.assign(ws.getCell(r, c0), { value: info.date, alignment: { horizontal: 'right' } }); }
    }
    for (let c = 1; c <= N; c++) { const x = ws.getCell(r, c); if (x.master === x && x.value) fitLine(ws, x); } // 客戶、日期字級也依內容調整
    r++;
  }
  // 沒範本才加這行；有範本（含 PDF）的抬頭自己有地址、電話的話已經由 fillInfo 填好
  const contact = !tpl ? [['地址', $('qAddr').value.trim()], ['電話', $('qPhone').value.trim()]].filter(x => x[1]).map(x => x[0] + '：' + x[1]).join('　') : '';
  if (contact) { mergeRow(r, 1, N); ws.getCell(r, 1).value = contact; fitLine(ws, ws.getCell(r, 1)); r++; }
  r++;

  const hr = r;
  cols.forEach((c, i) => Object.assign(ws.getCell(hr, i + 1), { value: c.name, font: { bold: true }, alignment: { horizontal: 'center', vertical: 'middle', wrapText: true }, border: box, fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE3F1E8' } } }));
  ws.getRow(hr).height = 22;

  const first = hr + 1, rowPt = (H + PAD * 2) * 0.75;
  items.forEach((img, i) => {
    const rr = first + i, row = ws.getRow(rr);
    row.height = rowPt;
    cols.forEach((c, j) => {
      const cell = row.getCell(j + 1);
      cell.value = c.role === 'index' ? i + 1 : c.role === 'name' ? labelOf(img) : c.role === 'qty' ? qtyOf(img)
        : c.role === 'price' ? priceOf(img)
        : c.role === 'size' ? (img.size || '').trim() || null
        : c.role === 'material' ? (img.spec || '').trim() || null
        : c.role === 'spec' ? specOneLine(img) || null
        : c.role === 'unit' && !tpl ? '件'
        : c.role === 'amount' && cQty && cPrice ? { formula: `IF(${L(cPrice)}${rr}="","",${L(cQty)}${rr}*${L(cPrice)}${rr})` } : null;
      cell.border = box;
      cell.alignment = { vertical: 'middle', horizontal: ['index', 'qty', 'unit'].includes(c.role) ? 'center' : ['price', 'amount'].includes(c.role) ? 'right' : 'left', wrapText: true };
      if (c.role === 'price' || c.role === 'amount') cell.numFmt = money;
      // 每一格字級都依內容調整；金額是公式，用數量×單價估顯示的字
      if (c.role === 'amount' && cQty && cPrice) { if (priceOf(img) != null) fitLine(ws, cell, 1, undefined, shownText(cell, priceOf(img) * qtyOf(img))); }
      else if (c.role !== 'image' && cell.value != null && cell.value !== '') fitLine(ws, cell);
    });
    const p = prepared[i];
    if (p) ws.addImage(wb.addImage({ buffer: p.buffer, extension: p.extension }), placeAt(ws, cImg, 1, rr, p.w, p.h));
  });

  const last = first + items.length - 1;
  r = last + 1;
  if (cAmt > 1) {
    const A = L(cAmt), subtotal = items.reduce((s, it) => s + (priceOf(it) ?? 0) * qtyOf(it), 0);
    const totalRow = (label, formula, bold) => {
      mergeRow(r, 1, cAmt - 1);
      Object.assign(ws.getCell(r, 1), { value: label, alignment: { horizontal: 'right' }, font: { bold } });
      Object.assign(ws.getCell(r, cAmt), { value: { formula }, numFmt: money, font: { bold }, alignment: { horizontal: 'right' } });
      if (subtotal) fitLine(ws, ws.getCell(r, cAmt), 1, undefined, shownText(ws.getCell(r, cAmt), Math.round(subtotal * 1.05)));
      mergeRow(r, cAmt + 1, N);
      for (let c = 1; c <= N; c++) ws.getCell(r, c).border = box;
      return r++;
    };
    const sub = totalRow('小計', `SUM(${A}${first}:${A}${last})`);
    if (tax) {
      const t = totalRow('營業稅 5%', `ROUND(${A}${sub}*0.05,0)`);
      totalRow('總計', `${A}${sub}+${A}${t}`, true);
    } else totalRow('總計', `${A}${sub}`, true);
  }

  r++;
  spec.notes.forEach(line => {
    mergeRow(r, 1, N);
    Object.assign(ws.getCell(r, 1), { value: line, alignment: { wrapText: true, vertical: 'top' } });
    ws.getRow(r).height = wrapHeight(line);
    r++;
  });
  if (spec.sign) {
    r++;
    const mid = Math.max(1, Math.ceil(N / 2));
    mergeRow(r, 1, mid); ws.getCell(r, 1).value = '報價人：';
    if (mid < N) { mergeRow(r, mid + 1, N); ws.getCell(r, mid + 1).value = '客戶簽名：'; }
    r++;
  }
  ws.pageSetup.printArea = `A1:${L(N)}${r - 1}`;
  ws.pageSetup.printTitlesRow = `${hr}:${hr}`;
  return new Blob([await fixSheetPr(await wb.xlsx.writeBuffer())], { type: XLSX_TYPE });
}

const isFormula = cell => cell.type === ExcelJS.ValueType.Formula;
const isBlank = cell => { const v = cell.master.value; return v == null || (typeof v === 'string' && !v.trim()); };
const sum = a => a.reduce((x, y) => x + y, 0);
const rowPx = (ws, r) => (ws.getRow(r).height || ws.properties.defaultRowHeight || 15) / 0.75;
// 某一格（含合併範圍）的位置和每欄寬、每列高（像素）
function cellBox(ws, r, c) {
  const m = ws._merges[ws.getCell(r, c).master.address];
  const top = m ? m.top : r, left = m ? m.left : c, bottom = m ? m.bottom : r, right = m ? m.right : c;
  return { top, left, widths: range(left, right).map(k => colPx(ws, k)), heights: range(top, bottom).map(k => rowPx(ws, k)) };
}
// 字級依內容多寡調整：一格一行、不換行（使用者 2026-10-30 要求儲存格裡不要換行），字縮到整段放得進格子（含合併範圍）
// 最大是格子原本的字級（不放大）、最小 6；hFrac：圖片也放在同一格時文字只能用一部分
// 字寬照「全形字一個字寬、半形約半個字寬」估算；回傳字級、塞不塞得下
function fontFor(box, text, base, hFrac = 1) {
  // 寬度估算照使用者改過的李公館估價單校正：13.875 寬的欄，「寬285*深90*高100」用 8 號、「寬180*深209*高110」用 7 號
  // （實際顯示比估算寬，也留一點左右空白，所以可用寬度只算 86%）
  const w = sum(box.widths) * 0.75 * 0.86, h = sum(box.heights) * 0.75 * hFrac - 5;
  const line = String(text ?? '').replace(/\n/g, '　');
  const width = [...line].reduce((a, ch) => a + (/[\x00-\xff]/.test(ch) ? 0.5 : 1), 0);
  const fit = s => w > 0 && width * s <= w && s * 1.3 <= h;
  let sz = Math.floor(base); // 一次縮 1 號，和一般人調字級一樣是整數
  while (sz > 6 && !fit(sz)) sz -= 1;
  return { sz, used: sz * 1.3, fits: fit(sz) };
}
// 填好的格子套上字級、不換行；Excel 的「縮小字型以適合欄寬」當保險（估得不準時 Excel 自己再縮）
// 換一個新的格式物件，範本裡格式相同的格子共用同一個，直接改會改到別格
// text：公式格（金額、合計）Excel 算出來才有值，傳預估要顯示的字；數字照格子的數字格式估（千分位、NT$）
function shownText(cell, v) {
  if (v instanceof Date) return todayStr('/');
  if (typeof v !== 'number') return String(v ?? '');
  const fmt = String(cell.numFmt || '');
  return (/\$|NT/.test(fmt) ? 'NT$ ' : '') + (/,/.test(fmt) ? Math.round(v).toLocaleString('en-US') : String(v));
}
function fitLine(ws, cell, hFrac = 1, valign, text) {
  const f = fontFor(cellBox(ws, cell.row, cell.col), text ?? shownText(cell, cell.value), cell.font?.size || 11, hFrac);
  cell.style = { ...cell.style, font: { ...(cell.font || {}), size: f.sz }, alignment: { ...(cell.alignment || {}), wrapText: false, shrinkToFit: true, ...(valign ? { vertical: valign } : {}) } };
  return f;
}
// 圖片放進這一格（置中，bottom 時貼底），左上和右下都綁在格子裡
function anchorIn(box, w, h, valign) {
  const locate = (v, sizes, start) => { let i = 0; while (i < sizes.length - 1 && v > sizes[i]) { v -= sizes[i]; i++; } return [start - 1 + i, Math.max(0, Math.round(v))]; };
  const x0 = (sum(box.widths) - w) / 2, y0 = valign === 'bottom' ? sum(box.heights) - h - 4 : valign === 'top' ? 4 : (sum(box.heights) - h) / 2;
  const [tc, tx] = locate(x0, box.widths, box.left), [bc, bx] = locate(x0 + w, box.widths, box.left);
  const [tr, ty] = locate(y0, box.heights, box.top), [br, by] = locate(y0 + h, box.heights, box.top);
  return {
    tl: { nativeCol: tc, nativeColOff: tx * EMU, nativeRow: tr, nativeRowOff: ty * EMU },
    br: { nativeCol: bc, nativeColOff: bx * EMU, nativeRow: br, nativeRowOff: by * EMU },
  };
}

// 範本裡圖片該放哪一欄：「圖片」欄 → 表格裡標題空白的欄 → 備註這類欄
function pickImageCol(t) {
  const img = t.cols.find(c => c.role === 'image');
  if (img) return { col: img.col, why: img.name ? `「${img.name}」欄` : ` ${colLetter(img.col)} 欄` };
  const ni = t.cols.find(c => c.role === 'name' && c.alsoImage);
  if (ni) return { col: ni.col, why: `「${colTitle(ni)}」欄的品名下方`, underName: true };
  const covered = new Set(t.cols.flatMap(c => range(c.col, c.col + c.span - 1)));
  const blank = range(t.minCol, t.maxCol).find(c => !covered.has(c));
  if (blank) return { col: blank, why: ` ${colLetter(blank)} 欄（標題空白的那欄）` };
  const note = t.cols.find(c => c.role === 'other' && /備註|樣式|示意|規格|說明/.test(flat(c.name)));
  const other = note || t.cols.filter(c => c.role === 'other').sort((a, b) => b.span - a.span)[0];
  if (other) return { col: other.col, why: `「${other.name}」欄` };
  const name = t.cols.find(c => c.role === 'name') || t.cols[0];
  return { col: name.col, why: `「${colTitle(name)}」欄` };
}

// 範本裡可以放品項的位置。一個品項可能佔好幾列（例如項次 A6:A9 合併就是 4 列一組），
// 以項次欄（沒有就用數量、金額欄）的合併範圍分組；品名還空著的組才放，已經有內容的不動
function itemRows(ws, t) {
  const nameCol = (t.cols.find(c => c.role === 'name') || t.cols[0]).col;
  const keyCol = (t.cols.find(c => c.role === 'index') || t.cols.find(c => c.role === 'qty') || t.cols.find(c => c.role === 'amount') || { col: nameCol }).col;
  const blockAt = r => { const m = ws._merges[ws.getCell(r, keyCol).master.address]; return m ? m.bottom : r; };
  const blocksIn = (a, b) => { const out = []; for (let r = a; r <= b; r = Math.max(r, blockAt(r)) + 1) out.push({ top: r, bottom: Math.min(Math.max(r, blockAt(r)), b) }); return out; };
  const free = k => isBlank(ws.getCell(k.top, nameCol));
  const cells = r => range(t.minCol, t.maxCol).map(c => ws.getCell(r, c));
  let end = t.h;
  if (t.tot) end = t.tot - 1;
  else {
    // 沒有合計列：有框線的列算表格；完全沒有框線就往下用整列空白的列
    const bordered = r => cells(r).some(c => Object.values(c.border || {}).some(Boolean));
    while (end < t.h + 500 && bordered(end + 1)) end++;
    if (end === t.h) {
      const rows = [];
      for (let r = t.h + 1; r <= t.h + 500 && cells(r).every(isBlank); r++) rows.push({ top: r, bottom: r });
      return { rows, all: rows, open: true, nameCol };
    }
  }
  let all = end > t.h ? blocksIn(t.h + 1, end) : [];
  // 只算和一般品項一樣大小的組，頁與頁之間的空白分隔列不算
  const size = b => b.bottom - b.top + 1, count = {};
  all.forEach(b => count[size(b)] = (count[size(b)] || 0) + 1);
  const common = +Object.keys(count).sort((a, b) => count[b] - count[a])[0];
  if (common > 1) all = all.filter(b => size(b) === common);
  return { rows: all.filter(free), all, open: false, end, nameCol };
}

// 公式裡第 L 列以下的參照往下移 n 列；範圍的結尾剛好在 L 也一起延長（合計才會算到新增的列）
const REF_RE = /(?<![A-Za-z0-9_.!])(\$?[A-Z]{1,3}\$?)(\d+)(?::(\$?[A-Z]{1,3}\$?)(\d+))?(?![A-Za-z0-9_(])/g;
const mapRefs = (f, fn) => String(f).split('"').map((seg, i) => i % 2 ? seg : seg.replace(REF_RE, fn)).join('"');
function shiftRefs(f, L, n) {
  return mapRefs(f, (m, c1, r1, c2, r2) => {
    const a = c1 + (+r1 > L ? +r1 + n : r1);
    return c2 === undefined ? a : a + ':' + c2 + (+r2 >= L ? +r2 + n : r2);
  });
}
// 複製到下面第 d 列的公式：沒鎖定（沒有 $）的列號一起加 d，例如 E7*F7 → E8*F8
function copyRefs(f, d) {
  const mv = (c, r) => c + (c.endsWith('$') ? r : +r + d);
  return mapRefs(f, (m, c1, r1, c2, r2) => mv(c1, r1) + (c2 === undefined ? '' : ':' + mv(c2, r2)));
}
// 在第 L 列下面新增 n 列，照 srcTop 開始、每 b 列一組的格式複製（框線、格式、列高、合併格、公式）
function insertRows(ws, L, n, srcTop, b) {
  ws.eachRow({ includeEmpty: true }, row => row.eachCell(cell => {
    if (isFormula(cell) && (cell.value.sharedFormula || cell.value.shareType)) cell.value = { formula: cell.formula, result: cell.result };
  }));
  const merges = Object.values(ws._merges).map(m => ({ top: m.top, left: m.left, bottom: m.bottom, right: m.right }));
  const below = merges.filter(m => m.top > L);
  // 解除合併會把合併格裡其他格的框線清掉（例如右邊、下面的框線），先記下來，移好再放回去
  const kept = [];
  below.forEach(m => { for (let r = m.top; r <= m.bottom; r++) for (let c = m.left; c <= m.right; c++) kept.push([r + n, c, clone(ws.getCell(r, c).style)]); });
  below.forEach(m => ws.unMergeCells(m.top, m.left, m.bottom, m.right));
  const inBlock = merges.filter(m => m.top >= srcTop && m.bottom <= L);
  const imgs = ws.getImages().filter(m => m.range?.tl && m.range.tl.nativeRow >= L);
  ws.spliceRows(L + 1, 0, ...Array.from({ length: n }, () => []));
  ws.eachRow({ includeEmpty: true }, row => row.eachCell(cell => {
    if (isFormula(cell)) cell.value = { formula: shiftRefs(cell.formula, L, n), result: cell.result };
  }));
  below.forEach(m => ws.mergeCellsWithoutStyle(m.top + n, m.left, m.bottom + n, m.right));
  kept.forEach(([r, c, s]) => { ws.getCell(r, c).style = s; });
  for (let r = L + 1; r <= L + n; r++) {
    const src = srcTop + (r - L - 1) % b, row = ws.getRow(r), from = ws.getRow(src);
    row.height = from.height;
    from.eachCell({ includeEmpty: true }, (c, col) => {
      const cell = row.getCell(col);
      cell.style = clone(c.style);
      if (isFormula(c) && !(c.isMerged && c.master.address !== c.address)) cell.value = { formula: copyRefs(c.formula, r - src) };
    });
  }
  for (let start = L + 1; start <= L + n; start += b) {
    // 不套用左上格的格式，每一格保留從範本複製來的框線
    inBlock.forEach(m => ws.mergeCellsWithoutStyle(m.top - srcTop + start, m.left, m.bottom - srcTop + start, m.right));
  }
  imgs.forEach(m => { m.range.tl.nativeRow += n; if (m.range.br) m.range.br.nativeRow += n; });
  if (ws.pageSetup.printArea) ws.pageSetup.printArea = shiftRefs(ws.pageSetup.printArea, L, n);
  (ws.__shifts = ws.__shifts || []).push({ L, n }); // 補回範本的圖形時，位置要跟著往下移
}

// 範本有好幾張工作表（例如依品項數量做好的不同版本）：選剛好放得下的那張，都不夠就選最大的
function pickSheet(wb, map, n) {
  const list = wb.worksheets.filter(s => !s.state || s.state === 'visible').map(s => {
    const t = findTableIn(s, map);
    if (!t) return null;
    const ir = itemRows(s, t);
    // blank：品項區還沒填過東西（已經寫好別的客戶品項的工作表，是舊估價單，不拿來用）
    return { ws: s, t, ir, cap: ir.open ? Infinity : ir.rows.length, blank: ir.open || ir.rows.length === ir.all.length };
  }).filter(Boolean);
  const pool = list.some(s => s.blank && s.cap > 0) ? list.filter(s => s.blank) : list;
  const fit = pool.filter(s => s.cap >= n).sort((a, b) => a.cap - b.cap)[0];
  return { pick: fit || [...pool].sort((a, b) => b.cap - a.cap)[0], list };
}

let fillNote = '';
async function fillXlsxTemplate() {
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(tpl.buf.slice(0));
  wb.calcProperties.fullCalcOnLoad = true;
  const map = tpl.spec.map, all = quoteItems();
  const { pick, list } = pickSheet(wb, map, all.length);
  const t0 = pick.t, ws = t0.ws, ir0 = pick.ir, per = ir0.rows.length;
  fillNote = '';
  if (list.length > 1) {
    // 打開檔案時直接顯示用到的那張，其他工作表不動
    const idx = wb.worksheets.indexOf(ws);
    wb.views = [{ ...((wb.views || [])[0] || {}), activeTab: idx, firstSheet: 0 }];
    wb.worksheets.forEach(s => { s.views = (s.views && s.views.length ? s.views : [{}]).map(v => ({ ...v, tabSelected: s === ws })); });
    fillNote = `用「${ws.name}」這張工作表。`;
  }
  // 每一頁的品項位置往下移幾列，第 1 頁就是範本本身
  const shifts = [0];
  if (all.length > per && !ir0.open && per > 0) {
    // 品項比範本多：在範本的品項區後面接著新增一頁品項格（中間分頁），
    // 總金額、匯款資料、約定事項整段往下移，只在最後一頁出現；總金額公式的加總範圍會自動延伸到新的品項
    const pages = Math.ceil(all.length / per), top = t0.h + 1, end = ir0.end, H = end - top + 1;
    insertRows(ws, end, H * (pages - 1), top, H);
    for (let p = 1; p < pages; p++) { ws.getRow(end + (p - 1) * H).addPageBreak(); shifts.push(p * H); }
    // 每頁表格底線：範本原本靠總計列的上框線收尾，總計移到最後一頁後，前面幾頁照它補一條
    const totRow = (t0.tot || end + 1) + H * (pages - 1);
    for (let p = 1; p < pages; p++) for (let c = t0.minCol; c <= t0.maxCol; c++) {
      const line = ws.getCell(totRow, c).border?.top || ws.getCell(end, c).border?.bottom || { style: 'thin' };
      const cell = ws.getCell(end + (p - 1) * H, c);
      cell.border = { ...(cell.border || {}), bottom: line };
    }
    // 範本沒設定每頁重複標題時，讓欄位標題列每頁都印出來
    if (!ws.pageSetup.printTitlesRow) ws.pageSetup.printTitlesRow = `${t0.h}:${t0.h}`;
    // 範本設成「整張縮成一頁」時分頁會被忽略、全部擠在一張紙：改成寬度一頁、高度照分頁（0＝自動）
    if (ws.pageSetup.fitToPage && ws.pageSetup.fitToHeight !== 0) ws.pageSetup.fitToHeight = 0;
    fillNote += `品項比範本多，已接著新增 ${pages - 1} 頁；總金額和下面的匯款、約定事項只放在最後一頁。`;
  } else if (all.length > per && !ir0.open) {
    // 範本裡沒有空的品項位置，只好照最後一組往下新增
    const last = ir0.all[ir0.all.length - 1];
    if (last) {
      const b = last.bottom - last.top + 1, need = all.length - per;
      insertRows(ws, ir0.end, need * b, last.top, b);
    }
  }

  const t = findTableIn(ws, map);
  let done = 0;
  for (let si = 0; si < shifts.length; si++) {
    let rows;
    if (si > 0) rows = ir0.all.map(b => ({ top: b.top + shifts[si], bottom: b.bottom + shifts[si] }));
    else if (per === 0 && !ir0.open) rows = itemRows(ws, t).all.slice(ir0.all.length); // 往下新增出來的那幾組
    else rows = ir0.rows;
    const chunk = all.slice(done, done + rows.length);
    // 項次空白要自己編號時：接著範本已有的品項和前幾頁往下編
    await fillBlocks(wb, ws, t, rows, chunk, ir0.all.length - per + done, done);
    done += chunk.length;
  }
  if (done < all.length) fillNote = `範本只有 ${done} 個品項位置，後面 ${all.length - done} 項沒有放進去。`;
  // 範本裡的文字框、圖形、線條補回去
  const shapeShifts = {};
  wb.worksheets.forEach(s => { if (s.__shifts) shapeShifts[s.name] = s.__shifts; });
  let out = await wb.xlsx.writeBuffer();
  try {
    const ks = await keepShapes(tpl.buf, out, shapeShifts);
    out = ks.buf;
    if (ks.lost) fillNote += `範本裡有 ${ks.lost} 個圖表或特殊物件沒辦法保留，請打開檔案確認。`;
  } catch (e) { errLog.push('keepShapes: ' + (e?.message || e)); }
  try { out = await fixSheetPr(out); } catch (e) { errLog.push('fixSheetPr: ' + (e?.message || e)); }
  return new Blob([out], { type: XLSX_TYPE });
}

// 尺寸、材質寫進一組品項的某一欄，看範本那一欄的格子怎麼切：
// 一組裡有好幾個獨立的列 → 一列一項，整組用同一個放得下的字級、垂直置中；整組只有一格 → 同一行用全形空白隔開（不換行）
function putLines(ws, c, top, bottom, vals) {
  const slots = [];
  for (let k = top; k <= bottom; k++) { const m = ws.getCell(k, c).master; if (!slots.includes(m)) slots.push(m); }
  if (!slots.length || !isBlank(slots[0])) return;
  if (slots.length < 2) { slots[0].value = vals.join('　'); fitLine(ws, slots[0]); return; }
  const base = slots[0].font?.size || 11;
  const sz = Math.min(...vals.map((v, k) => k < slots.length ? fontFor(cellBox(ws, slots[k].row, slots[k].col), v, base).sz : base));
  vals.forEach((v, k) => { if (k < slots.length && isBlank(slots[k])) slots[k].value = k === slots.length - 1 ? vals.slice(k).join('　') : v; });
  slots.forEach(s => { s.style = { ...s.style, font: { ...(s.font || {}), size: sz }, alignment: { ...(s.alignment || {}), vertical: 'middle', wrapText: false, shrinkToFit: true } }; });
}

// 把品項填進一張工作表的品項位置
async function fillBlocks(wb, ws, t, rows, items, used, doneBefore) {
  const L = colLetter, PAD = 4, total = quoteItems().length;
  const ic = pickImageCol(t);
  const at = role => t.cols.find(c => c.role === role)?.col;
  const cIdx = at('index'), cName = at('name'), cQty = at('qty'), cPrice = at('price'), cAmt = at('amount');
  // 尺寸、材質：範本有「尺寸」「材質」欄就各放各的；沒有專屬欄的放「規格」欄 → 品名欄叫「名稱及規格」就接在品名後面 → 空白的備註欄
  const cSize = at('size'), cMat = at('material');
  const cSpec = at('spec'), nameC = t.cols.find(c => c.role === 'name');
  const nameHasSpec = !cSpec && !cSize && !cMat && nameC && /規格|說明/.test(flat(nameC.name));
  const cNote = !cSpec && !nameHasSpec ? t.cols.find(c => c.role === 'other' && /備註|說明/.test(flat(c.name)) && c.col !== ic.col)?.col : null;

  for (let i = 0; i < items.length; i++) {
    showMsg(`處理圖片 ${doneBefore + i + 1} / ${total}…`);
    const blk = rows[i], r = blk.top, img = items[i];
    // 只填空白的格子；每一格字級都依內容調整（使用者 2026-10-30 要求所有欄位都要）
    const put = (c, v, text) => { if (!c) return null; const cell = ws.getCell(r, c).master; if (!isBlank(cell)) return null; cell.value = v; fitLine(ws, cell, 1, undefined, text); return cell; };
    put(cIdx, used + i + 1);
    // 尺寸、材質不加「尺寸：」「材質：」；每格一行、不換行，字級依內容調整
    const sizeV = (img.size || '').trim(), matV = (img.spec || '').trim();
    if (cSize && sizeV) put(cSize, sizeV);
    if (cMat && matV) put(cMat, matV);
    const vals = [!cSize && sizeV, !cMat && matV].filter(Boolean), spec = vals.join('　'); // 沒有專屬欄的
    const under = ic.underName || ic.col === cName;
    const nb = ws._merges[ws.getCell(r, ic.col).master.address]?.bottom ?? r; // 品名格的最後一列
    const imgInName = under && nb >= blk.bottom; // 圖片也放在品名那一格（貼底），文字只能用上面約三成
    // 「名稱及規格」：品名和尺寸材質同一行放得下（9 號以上）就接在品名後面；放不下就寫在下面圖片格的底部
    let specBelow = false;
    if (nameHasSpec && spec && under && !imgInName && cName) {
      const nc = ws.getCell(r, cName).master, f = fontFor(cellBox(ws, r, cName), `${labelOf(img)}　${spec}`, nc.font?.size || 11);
      specBelow = !f.fits || f.sz < 9;
    }
    const nameCell = put(cName, nameHasSpec && spec && !specBelow ? `${labelOf(img)}　${spec}` : labelOf(img));
    if (nameCell) fitLine(ws, nameCell, imgInName ? 0.3 : 1);
    let textPx = 0;
    if (specBelow) {
      const sc = ws.getCell(nb + 1, ic.col).master;
      if (isBlank(sc)) {
        sc.value = spec;
        sc.style = { ...sc.style, alignment: { ...(sc.alignment || {}), horizontal: 'center' } };
        textPx = fitLine(ws, sc, 0.4, 'bottom').used / 0.75 + 4;
      }
    }
    if (spec && !nameHasSpec && (cSpec || cNote)) putLines(ws, cSpec || cNote, r, blk.bottom, vals);
    put(cQty, qtyOf(img));
    if (cPrice && priceOf(img) != null) put(cPrice, priceOf(img));
    if (cQty && cPrice) {
      const ac = cAmt && ws.getCell(r, cAmt).master, amt = priceOf(img) != null ? priceOf(img) * qtyOf(img) : null;
      put(cAmt, { formula: `IF(${L(cPrice)}${r}="","",${L(cQty)}${r}*${L(cPrice)}${r})` }, ac ? shownText(ac, amt ?? '') : '');
    }
    // 圖片的格子：品名和圖片同一欄時，放在品名下面那塊合併格；整組只有一格就貼底，留上面給品名
    let box, bottom = false;
    if (under) {
      if (nb < blk.bottom) box = cellBox(ws, nb + 1, ic.col);
      else { box = cellBox(ws, r, ic.col); bottom = true; }
    } else {
      box = cellBox(ws, r, ic.col);
      if (!isBlank(ws.getCell(box.top, box.left))) continue; // 那格已經有內容，不蓋掉
    }
    // 圖片縮放到剛好放進格子，欄寬列高都不動；欄寬換算成像素只是估計，寬度多留一點
    // 格子底部寫了尺寸材質時，圖片放在上面、不壓到字
    const maxW = sum(box.widths) * 0.92 - PAD * 2, maxH = sum(box.heights) * (bottom ? 0.68 : 1) - PAD * 2 - textPx;
    if (maxW < 4 || maxH < 4) continue;
    try {
      const p = await prepImage(await srcOf(img), maxH, maxW);
      ws.addImage(wb.addImage({ buffer: p.buffer, extension: p.extension }), anchorIn(box, p.w, p.h, bottom ? 'bottom' : textPx ? 'top' : ''));
    } catch {}
  }

  // 客戶、日期：只填在標籤旁邊空白的格子
  const client = $('qClient').value.trim(), addr = $('qAddr').value.trim(), phone = $('qPhone').value.trim();
  const infoRows = [...range(1, t.h - 1), ...(t.totEnd ? range(t.totEnd + 1, ws.rowCount) : [])];
  // 「業主名稱：」這種標籤：標籤格合併得比旁邊寬，就接在標籤後面；否則填旁邊的空格；旁邊有東西就不動
  const fillLabel = (r, col, cell, text, value) => {
    const next = ws.getCell(r, col + mergeSpan(ws, cell)).master;
    const wide = c => sum(cellBox(ws, c.row, c.col).widths);
    if (/[:：]\s*$/.test(text) && mergeSpan(ws, cell) > 1 && wide(cell) > wide(next)) { cell.value = text.trimEnd() + value; fitLine(ws, cell); }
    else if (isBlank(next)) { next.value = value; fitLine(ws, next); }
  };
  for (const r of infoRows) for (const { col, cell, text } of masterCells(ws, r)) {
    if (isFormula(cell)) continue;
    const f = flat(text).replace(/[:：]$/, '');
    // 地址、電話只看表頭上面（總計下面的多半是公司自己的）
    const contact = r < t.h ? (ADDR_ONLY.test(f) ? addr : PHONE_ONLY.test(f) ? phone : '') : '';
    if (contact) { fillLabel(r, col, cell, text, contact); continue; }
    const kind = CLIENT_ONLY.test(f) ? 'client' : DATE_ONLY.test(f) ? 'date' : null;
    if (!kind) {
      // 同一格裡就有日期：「日期：115年  月  日」「中華民國　年　月　日」照原本的寫法填今天
      if (DATE_WORD.test(text) || /中華民國.*年.*月.*日/.test(text)) { const neu = fillDateText(text); if (neu !== text) { cell.value = neu; fitLine(ws, cell); } }
      continue;
    }
    if (kind === 'client' && !client) continue;
    if (kind === 'client') { fillLabel(r, col, cell, text, client); continue; }
    const next = ws.getCell(r, col + mergeSpan(ws, cell)).master;
    // 「日期」旁邊那格：空白填今天；是日期值就換今天（格式不動）；是文字就照它的寫法換
    if (isBlank(next)) next.value = todayStr('/');
    else if (next.value instanceof Date) { const d = new Date(); next.value = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); }
    else if (!isFormula(next)) { const neu = todayIn(cellText(next)); if (neu != null) next.value = neu; else continue; }
    else continue;
    fitLine(ws, next);
  }
  // 合計、稅金、總計這幾格（公式）：用這次的總金額估顯示的字，字級跟著調
  if (cAmt && t.tot) {
    const subtotal = quoteItems().reduce((s, it) => s + (priceOf(it) ?? 0) * qtyOf(it), 0);
    if (subtotal) for (let r = t.tot; r <= (t.totEnd || t.tot); r++) {
      const c = ws.getCell(r, cAmt).master;
      if (isFormula(c)) fitLine(ws, c, 1, undefined, shownText(c, Math.round(subtotal * 1.05)));
    }
  }
}

// ---------- 產生 PPT ----------
const toDataURL = (buffer, ext) => new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(new Blob([buffer], { type: 'image/' + ext })); });

// 在 box 裡排 n 張圖，每張下面留一行品名；最後一排置中
function gridCells(box, n, capH, gap) {
  const cols = n <= 1 ? 1 : n === 2 ? 2 : n === 3 ? (box.w / box.h > 1.6 ? 3 : 2) : 2;
  const rows = Math.ceil(n / cols);
  const cw = (box.w - gap * (cols - 1)) / cols, rh = (box.h - gap * (rows - 1)) / rows;
  return range(0, n - 1).map(i => {
    const r = Math.floor(i / cols), c = i - r * cols, inRow = Math.min(cols, n - r * cols);
    const x = box.x + (box.w - (inRow * cw + (inRow - 1) * gap)) / 2 + c * (cw + gap), y = box.y + r * (rh + gap);
    return { x, y, w: cw, h: rh - capH, cap: { x, y: y + rh - capH, w: cw, h: capH } };
  });
}
// 圖片等比例縮進格子，貼齊格子底部，品名才會排成一直線
function fitBottom(cell, iw, ih) {
  const k = Math.min(cell.w / iw, cell.h / ih), w = iw * k, h = ih * k;
  return { x: cell.x + (cell.w - w) / 2, y: cell.y + cell.h - h, w, h };
}

async function buildPptx() {
  if (tpl?.kind === 'pptx') return fillPptx();
  const PptxGenJS = await loadLib('pptx');
  const company = tpl ? currentSpec().head[0] : $('qCompany').value.trim(), client = $('qClient').value.trim();
  const pres = new PptxGenJS();
  pres.layout = 'LAYOUT_WIDE'; // 13.33 x 7.5 英吋
  const FONT = 'Microsoft JhengHei', GREEN = '1F7A4D', INK = '1D2621', GREY = '5F6D65';
  const items = quoteItems(), pages = roomPages(items);

  const cover = pres.addSlide();
  cover.background = { color: 'F3F5F2' };
  cover.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: 0.35, h: 7.5, fill: { color: GREEN }, line: { color: GREEN } });
  cover.addText(company || '產品提案', { x: 1, y: 2.3, w: 11.3, h: 1.2, fontFace: FONT, fontSize: 40, bold: true, color: INK });
  cover.addText([client ? '提案對象：' + client : '', '日期：' + todayStr('/'), `共 ${items.length} 項`].filter(Boolean).join('　｜　'),
    { x: 1, y: 3.6, w: 11.3, h: 0.6, fontFace: FONT, fontSize: 18, color: GREY });

  let done = 0;
  for (const pg of pages) {
    const s = pres.addSlide();
    s.background = { color: 'FFFFFF' };
    s.addText(pg.title, { x: 0.6, y: 0.35, w: 12.13, h: 0.8, fontFace: FONT, fontSize: 28, bold: true, color: INK });
    s.addShape(pres.ShapeType.line, { x: 0.6, y: 1.2, w: 12.13, h: 0, line: { color: GREEN, width: 2 } });
    const lines = Math.max(0, ...pg.items.map(i => detailLines(i).length));
    const cells = gridCells({ x: 0.6, y: 1.5, w: 12.13, h: 5.65 }, pg.items.length, [0.5, 0.85, 1.1][lines], 0.35);
    for (let j = 0; j < pg.items.length; j++) {
      const img = pg.items[j];
      showMsg(`處理圖片 ${++done} / ${items.length}…`);
      try {
        const p = await prepImage(await srcOf(img), 720);
        s.addImage({ data: await toDataURL(p.buffer, p.extension), ...fitBottom(cells[j], p.w, p.h) });
      } catch {}
      const sub = detailLines(img);
      s.addText(sub.length ? [{ text: labelOf(img), options: { fontSize: 16, color: INK, breakLine: true } }, ...sub.map((t, k) => ({ text: t, options: { fontSize: 12, color: GREY, breakLine: k < sub.length - 1 } }))] : labelOf(img),
        { ...cells[j].cap, fontFace: FONT, fontSize: 16, color: INK, align: 'center', valign: 'top' });
    }
  }
  // 產生 PPT 的套件會登記幾個不存在的母片，PowerPoint 可能因此要修復，先清掉
  const JSZip = await loadLib('jszip');
  const zip = await JSZip.loadAsync(await pres.write({ outputType: 'arraybuffer' }));
  const ct = parseXml(await zip.file('[Content_Types].xml').async('string'));
  [...ct.getElementsByTagNameNS(CT_NS, 'Override')].filter(o => !zip.file(o.getAttribute('PartName').slice(1))).forEach(o => o.remove());
  zip.file('[Content_Types].xml', xmlStr(ct));
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
}

function xfrmOf(el) {
  const x = el.getElementsByTagNameNS(NS.a, 'xfrm')[0];
  const off = x && aEls(x, 'off')[0], ext = x && aEls(x, 'ext')[0];
  if (!off || !ext) return null;
  return { x: +off.getAttribute('x'), y: +off.getAttribute('y'), w: +ext.getAttribute('cx'), h: +ext.getAttribute('cy') };
}
const phType = el => { const ph = el.getElementsByTagNameNS(NS.p, 'ph')[0]; return ph ? (ph.getAttribute('type') || 'obj') : null; };

// 投影片上最大的一塊空白（避開裝飾圖形、Logo），用格子近似
function largestFree(obs, CX, CY) {
  const GW = 48, GH = Math.max(12, Math.round(48 * CY / CX)), cw = CX / GW, ch = CY / GH, m = CX * 0.012;
  const occ = Array.from({ length: GH }, () => new Uint8Array(GW));
  for (const b of obs) {
    const x0 = Math.max(0, Math.floor((b.x - m) / cw)), x1 = Math.min(GW - 1, Math.ceil((b.x + b.w + m) / cw) - 1);
    const y0 = Math.max(0, Math.floor((b.y - m) / ch)), y1 = Math.min(GH - 1, Math.ceil((b.y + b.h + m) / ch) - 1);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) occ[y][x] = 1;
  }
  const h = new Array(GW).fill(0);
  let best = { area: 0, x: 0, y: 0, w: GW, h: GH };
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) h[x] = occ[y][x] ? 0 : h[x] + 1;
    const st = [];
    for (let x = 0; x <= GW; x++) {
      const cur = x < GW ? h[x] : 0;
      let start = x;
      while (st.length && st[st.length - 1][1] >= cur) {
        const [sx, sh] = st.pop(), area = sh * (x - sx);
        if (area > best.area) best = { area, x: sx, y: y - sh + 1, w: x - sx, h: sh };
        start = sx;
      }
      st.push([start, cur]);
    }
  }
  return { x: best.x * cw, y: best.y * ch, w: best.w * cw, h: best.h * ch };
}

// PPT 範本：範本原本的投影片都不動，在結尾頁前面加入品項頁
async function fillPptx() {
  const JSZip = await loadLib('jszip');
  const zip = await JSZip.loadAsync(tpl.buf.slice(0));
  const { pres, presRels, lst, slides } = await slideOrder(zip);
  const sz = pres.getElementsByTagNameNS(NS.p, 'sldSz')[0];
  const CX = +sz.getAttribute('cx'), CY = +sz.getAttribute('cy'), AREA = CX * CY;
  const ct = parseXml(await zip.file('[Content_Types].xml').async('string'));
  const ctAdd = (tag, attrs) => {
    if (tag === 'Override' && [...ct.getElementsByTagNameNS(CT_NS, 'Override')].some(o => o.getAttribute('PartName') === attrs.PartName)) return;
    const e = ct.createElementNS(CT_NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); ct.documentElement.appendChild(e);
  };
  const ctHasDefault = ext => [...ct.getElementsByTagNameNS(CT_NS, 'Default')].some(d => d.getAttribute('Extension').toLowerCase() === ext);
  const ctOf = part => [...ct.getElementsByTagNameNS(CT_NS, 'Override')].find(o => o.getAttribute('PartName') === '/' + part)?.getAttribute('ContentType');
  // 圖表、SmartArt、內嵌物件、標籤這類不能讓好幾頁共用，每頁各複製一份
  const SHARED = /\/(slideLayout|slideMaster|image|media|video|audio|hdphoto|hyperlink|slide|notesSlide|theme|font)$/;
  async function cloneParts(relsDoc, owner, tag) {
    for (const rel of relsOf(relsDoc)) {
      if (rel.getAttribute('TargetMode') === 'External' || SHARED.test(rel.getAttribute('Type'))) continue;
      const src = resolvePath(owner, rel.getAttribute('Target'));
      if (!zip.file(src)) continue;
      const dst = src.replace(/(\.[^./]+)$/, `_q${tag}$1`);
      zip.file(dst, await zip.file(src).async('uint8array'));
      const type = ctOf(src);
      if (type) ctAdd('Override', { PartName: '/' + dst, ContentType: type });
      if (zip.file(relsPath(src))) {
        const sub = parseXml(await zip.file(relsPath(src)).async('string'));
        await cloneParts(sub, src, tag);
        zip.file(relsPath(dst), xmlStr(sub));
      }
      rel.setAttribute('Target', rel.getAttribute('Target').replace(/[^/]+$/, dst.split('/').pop()));
    }
  }
  const P14 = 'http://schemas.microsoft.com/office/powerpoint/2010/main';
  const read = async p => zip.file(p) ? parseXml(await zip.file(p).async('string')) : null;
  const kids = doc => [...doc.getElementsByTagNameNS(NS.p, 'spTree')[0].children].filter(e => ['sp', 'pic', 'graphicFrame', 'grpSp', 'cxnSp'].includes(e.localName));
  const hasText = el => aEls(el, 't').some(t => t.textContent.trim());
  const area = b => b ? b.w * b.h : 0;
  const R = Math.round;

  // 品項頁的樣式：內頁裡有大張照片的那頁優先，沒有就用第 2 頁
  const inner = slides.length >= 3 ? slides.slice(1, -1) : slides.slice(slides.length >= 2 ? 1 : 0);
  let proto = inner[0];
  for (const s of inner) {
    const d = await read(s.path);
    if (d && kids(d).some(e => e.localName === 'pic' && area(xfrmOf(e)) > AREA * 0.15)) { proto = s; break; }
  }
  const protoXml = await zip.file(proto.path).async('string');
  const protoRels = zip.file(relsPath(proto.path)) ? await zip.file(relsPath(proto.path)).async('string') : `<Relationships xmlns="${REL_NS}"/>`;
  const protoHasPhoto = kids(parseXml(protoXml)).some(e => e.localName === 'pic' && area(xfrmOf(e)) > AREA * 0.15);

  // 看得見的物件才要避開：沒填色、沒框線、沒文字的空白框（範本裡常有）不算
  function seen(e) {
    if (e.localName !== 'sp') return true;
    // 文字要看得見才算（範本網站常在母片藏一行設成「無填滿」的浮水印字）
    if (aEls(e, 'r').some(r => r.textContent.trim() && ![...(aEls(r, 'rPr')[0]?.children || [])].some(c => c.localName === 'noFill'))) return true;
    const sp = e.getElementsByTagNameNS(NS.p, 'spPr')[0], kidsP = sp ? [...sp.children] : [];
    const style = e.getElementsByTagNameNS(NS.p, 'style')[0];
    const ref = n => { const x = style && style.getElementsByTagNameNS(NS.a, n)[0]; return x && x.getAttribute('idx') !== '0'; };
    const fill = kidsP.some(c => /^(solidFill|gradFill|blipFill|pattFill)$/.test(c.localName)) || (!kidsP.some(c => c.localName === 'noFill') && ref('fillRef'));
    const ln = kidsP.find(c => c.localName === 'ln');
    const line = ln ? ![...ln.children].some(c => c.localName === 'noFill') && ln.children.length > 0 : ref('lnRef');
    return fill || line;
  }
  // 版面配置和母片上的固定圖形（Logo、色條）也要避開
  const fixed = [];
  const layoutRel = relsOf(parseXml(protoRels)).find(r => r.getAttribute('Type') === REL_T + 'slideLayout');
  if (layoutRel) {
    const lp = resolvePath(proto.path, layoutRel.getAttribute('Target')), ld = await read(lp);
    if (ld) {
      kids(ld).filter(e => !phType(e) && seen(e)).forEach(e => fixed.push(xfrmOf(e)));
      const lr = await read(relsPath(lp));
      const mRel = lr && relsOf(lr).find(r => r.getAttribute('Type') === REL_T + 'slideMaster');
      const showMaster = ld.documentElement.getAttribute('showMasterSp') !== '0' && parseXml(protoXml).documentElement.getAttribute('showMasterSp') !== '0';
      const md = showMaster && mRel && await read(resolvePath(lp, mRel.getAttribute('Target')));
      if (md) kids(md).filter(e => !phType(e) && seen(e)).forEach(e => fixed.push(xfrmOf(e)));
    }
  }

  // 複製樣式頁，拿掉上面的文字、照片、圖表，只留背景和裝飾；minimal 時裝飾也拿掉
  async function baseSlide(tag, minimal) {
    const doc = parseXml(protoXml), rels = parseXml(protoRels);
    relsOf(rels).filter(r => r.getAttribute('Type') === REL_T + 'notesSlide').forEach(r => r.remove());
    // 文字樣式沿用範本標題的字型和顏色
    const tsp = kids(doc).find(e => ['title', 'ctrTitle'].includes(phType(e)) && hasText(e)) || kids(doc).find(e => e.localName === 'sp' && hasText(e));
    const rprEl = tsp && aEls(tsp, 'r').map(r => aEls(r, 'rPr')[0]).find(Boolean);
    const rpr = rprEl ? new XMLSerializer().serializeToString(rprEl) : '';
    const obstacles = [];
    for (const e of kids(doc)) {
      const b = xfrmOf(e), t = phType(e), keepPh = ['sldNum', 'dt', 'ftr'].includes(t);
      const content = !keepPh && (t || hasText(e) || e.localName === 'graphicFrame' || (e.localName === 'pic' && area(b) > AREA * 0.04));
      if (content || (minimal && !keepPh && area(b) < AREA * 0.5 && !(e.localName === 'pic' && area(b) < AREA * 0.04))) { e.remove(); continue; }
      if (b && area(b) < AREA * 0.5 && seen(e)) obstacles.push(b);
    }
    doc.getElementsByTagNameNS(NS.p, 'timing')[0]?.remove(); // 範本的動畫指著拿掉的東西
    [...doc.getElementsByTagNameNS(P14, 'creationId')].forEach(e => e.setAttribute('val', String(Math.floor(Math.random() * 4294967295))));
    await cloneParts(rels, proto.path, tag);
    return { doc, rels, rpr, obstacles: [...obstacles, ...fixed.filter(b => b && area(b) < AREA * 0.5)] };
  }

  function textBox(doc, id, b, text, rpr, sz, bold, algn, sub) {
    const node = doc.importNode(parseXml(`<p:sp xmlns:p="${NS.p}" xmlns:a="${NS.a}"><p:nvSpPr><p:cNvPr id="${id}" name="文字 ${id}"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${R(b.x)}" y="${R(b.y)}"/><a:ext cx="${R(b.w)}" cy="${R(b.h)}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr><p:txBody><a:bodyPr wrap="square" lIns="0" tIns="0" rIns="0" bIns="0" anchor="${bold ? 'ctr' : 't'}"><a:normAutofit/></a:bodyPr><a:lstStyle/><a:p><a:pPr algn="${algn}"/><a:r><a:rPr lang="zh-TW"/><a:t></a:t></a:r></a:p></p:txBody></p:sp>`).documentElement, true);
    aEls(node, 't')[0].textContent = text;
    if (rpr) aEls(node, 'rPr')[0].replaceWith(doc.importNode(parseXml(rpr).documentElement, true));
    const r = aEls(node, 'rPr')[0];
    r.setAttribute('lang', 'zh-TW'); r.setAttribute('sz', String(sz)); r.setAttribute('b', bold ? '1' : '0'); r.removeAttribute('dirty');
    [...r.children].filter(c => /^hlink/.test(c.localName)).forEach(c => c.remove());
    // 範本標題是壓在照片上的白字，放到空白處會看不到，改用預設文字顏色
    const fill = [...r.children].find(c => c.localName === 'solidFill');
    const clr = fill?.firstElementChild, white = clr && ((clr.localName === 'srgbClr' && /^F{6}$/i.test(clr.getAttribute('val'))) || (clr.localName === 'schemeClr' && /^(bg1|lt1)$/.test(clr.getAttribute('val'))));
    if (white && protoHasPhoto) fill.remove();
    for (const line of sub || []) { // 下面每行一項小字：尺寸、材質
      const p2 = aEls(node, 'p')[0].cloneNode(true);
      aEls(p2, 't')[0].textContent = line;
      aEls(p2, 'rPr')[0].setAttribute('sz', String(Math.round(sz * 0.72)));
      node.getElementsByTagNameNS(NS.p, 'txBody')[0].appendChild(p2);
    }
    return node;
  }
  function picNode(doc, id, rid, b) {
    return doc.importNode(parseXml(`<p:pic xmlns:p="${NS.p}" xmlns:a="${NS.a}" xmlns:r="${NS.r}"><p:nvPicPr><p:cNvPr id="${id}" name="Picture ${id}"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="${R(b.x)}" y="${R(b.y)}"/><a:ext cx="${R(b.w)}" cy="${R(b.h)}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>`).documentElement, true);
  }

  let slideNum = Math.max(0, ...Object.keys(zip.files).map(f => +((f.match(/^ppt\/slides\/slide(\d+)\.xml$/) || [])[1] || 0)));
  let sldId = Math.max(255, ...slides.map(s => +s.el.getAttribute('id')));
  const items = quoteItems(), pages = roomPages(items), newEls = [];
  let done = 0;

  for (let pi = 0; pi < pages.length; pi++) {
    const pg = pages[pi];
    let base = await baseSlide(pi + 1, false), free = largestFree(base.obstacles, CX, CY);
    // 裝飾佔掉一半以上就改用乾淨的頁面（只留 Logo）
    if (area(free) < AREA * 0.45) { base = await baseSlide(pi + 1, true); free = largestFree(base.obstacles, CX, CY); }
    const { doc, rels, rpr } = base;
    const tree = doc.getElementsByTagNameNS(NS.p, 'spTree')[0];
    let nextId = Math.max(1, ...[...doc.getElementsByTagNameNS(NS.p, 'cNvPr')].map(e => +e.getAttribute('id') || 0)) + 1;

    // 空白區留邊：上方放空間名稱，下面排圖片和品名
    // 排版照使用者 2026-10-27 改過的簡報：空間名稱在左上角（右上角有 Logo 就同一排、不重疊），
    // 品項緊接在標題下面往下排，圖片約頁高 28%、品名加尺寸材質兩行約 10%
    const pad = Math.min(free.w, free.h) * 0.02, gap = Math.min(CX, CY) * 0.03;
    const hits = b => base.obstacles.some(o => b.x < o.x + o.w && o.x < b.x + b.w && b.y < o.y + o.h && o.y < b.y + b.h);
    const titleH = CY * 0.076, tx = free.x + pad, tw = Math.min(free.w - pad * 2, CX * 0.45);
    let ty = 0;
    while (ty < free.y + pad && hits({ x: tx, y: ty, w: tw, h: titleH })) ty += CY * 0.01;
    ty = Math.min(ty, free.y + pad);
    const top = Math.max(ty + titleH + CY * 0.018, free.y + pad), bottom = free.y + free.h - pad;
    const lines = Math.max(0, ...pg.items.map(i => detailLines(i).length)), more = lines > 0; // 有尺寸、材質就多留幾行
    const capH = CY * [0.065, 0.1, 0.12][lines];
    const n = pg.items.length, cols = n <= 1 ? 1 : n === 2 ? 2 : n === 3 ? ((free.w - pad * 2) / (bottom - top) > 1.6 ? 3 : 2) : 2, rows = Math.ceil(n / cols);
    const rowH = Math.min((bottom - top - gap * (rows - 1)) / rows, CY * 0.28 + capH);
    const body = { x: free.x + pad, y: top, w: free.w - pad * 2, h: rowH * rows + gap * (rows - 1) };
    const cells = gridCells(body, n, capH, gap);
    const pt = emu => Math.round(emu / 12700);
    tree.appendChild(textBox(doc, nextId++, { x: tx, y: ty, w: Math.max(tw, body.w), h: titleH }, pg.title, rpr, Math.min(3200, Math.max(1600, pt(titleH) * 60)), true, 'l'));
    for (let j = 0; j < pg.items.length; j++) {
      const img = pg.items[j];
      showMsg(`處理圖片 ${++done} / ${items.length}…`);
      try {
        const p = await prepImage(await srcOf(img), 720);
        const ext = p.extension === 'png' ? 'png' : 'jpeg', media = `qimg${pi + 1}_${j + 1}.${ext}`, rid = 'rIdQ' + (j + 1);
        zip.file('ppt/media/' + media, p.buffer);
        if (!ctHasDefault(ext)) ctAdd('Default', { Extension: ext, ContentType: 'image/' + ext });
        const rel = rels.createElementNS(REL_NS, 'Relationship');
        rel.setAttribute('Id', rid); rel.setAttribute('Type', REL_T + 'image'); rel.setAttribute('Target', '../media/' + media);
        rels.documentElement.appendChild(rel);
        tree.appendChild(picNode(doc, nextId++, rid, fitBottom(cells[j], p.w, p.h)));
      } catch {}
      tree.appendChild(textBox(doc, nextId++, cells[j].cap, labelOf(img), rpr, Math.min(1800, Math.max(1000, pt(more ? CY * 0.1 : capH) * (more ? 32 : 55))), false, 'ctr', detailLines(img)));
    }

    const path = `ppt/slides/slide${++slideNum}.xml`;
    zip.file(path, xmlStr(doc));
    zip.file(relsPath(path), xmlStr(rels));
    ctAdd('Override', { PartName: '/' + path, ContentType: 'application/vnd.openxmlformats-officedocument.presentationml.slide+xml' });
    const prid = 'rIdQS' + (pi + 1);
    const pr = presRels.createElementNS(REL_NS, 'Relationship');
    pr.setAttribute('Id', prid); pr.setAttribute('Type', REL_T + 'slide'); pr.setAttribute('Target', `slides/slide${slideNum}.xml`);
    presRels.documentElement.appendChild(pr);
    const el = pres.createElementNS(NS.p, 'p:sldId');
    el.setAttribute('id', ++sldId); el.setAttributeNS(NS.r, 'r:id', prid);
    newEls.push(el);
  }

  // 插在結尾頁前面（範本只有 1、2 頁就放最後）；章節也跟著加進去
  const before = slides.length >= 3 ? slides[slides.length - 1] : null;
  newEls.forEach(e => lst.insertBefore(e, before ? before.el : null));
  const prevId = (before ? slides[slides.length - 2] : slides[slides.length - 1]).el.getAttribute('id');
  for (const hit of pres.getElementsByTagNameNS('*', 'sldId')) {
    if (hit.namespaceURI === NS.p || hit.getAttribute('id') !== prevId) continue;
    let after = hit;
    for (const e of newEls) {
      const n = pres.createElementNS(hit.namespaceURI, hit.prefix ? hit.prefix + ':sldId' : 'sldId');
      n.setAttribute('id', e.getAttribute('id'));
      after.after(n); after = n;
    }
    break;
  }

  zip.file('ppt/presentation.xml', xmlStr(pres));
  zip.file('ppt/_rels/presentation.xml.rels', xmlStr(presRels));
  zip.file('[Content_Types].xml', xmlStr(ct));
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
}

// ---------- 下載 ----------
let downloads; // 在 Claude 裡開啟時用平台的下載功能
if (window.claude?.use) window.claude.use('downloads').then(d => downloads = d).catch(() => {});

async function save(blob, filename) {
  if (downloads) {
    try { await downloads.save({ filename, data: blob }); return '已下載：' + filename; }
    catch (e) { if (e?.code === 'declined') return '已取消下載。'; if (e?.code === 'rate_limited') return '下載視窗還開著，請先處理它。'; }
  }
  if (window.claude?.use && !downloads) throw new Error('nodl');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return '已下載：' + filename;
}

    const client = $('qClient').value.trim().replace(/[\\/:*?"<>|]/g, '');
    const done = await save(blob, `${fmt === 'pptx' ? '簡報' : '估價單'}${client ? '_' + client : ''}_${todayStr('')}.${fmt}`);
    showMsg(fillNote ? done + '　' + fillNote : done, /沒有放進去/.test(fillNote));
    if ($('libSave').checked && /^已下載/.test(done)) { await memSave(quoteItems()); applyMem(); }
  } catch (e) {
    errLog.push(String(e?.stack || e?.message || e).slice(0, 400));
    showMsg(e.message === 'nodl' ? '這個畫面不能下載檔案，請在 claude.ai 開啟這個頁面。' : '產生失敗：' + (e.message || e), true);
  } finally { $('go').disabled = !images.length; }
});

// ---------- 拖放（可拖整個資料夾） ----------
function readEntry(entry) {
  return new Promise(ok => {
    if (entry.isFile) return entry.file(f => ok([f]), () => ok([]));
    const rd = entry.createReader(), out = [];
    const more = () => rd.readEntries(async ents => {
      if (!ents.length) return ok((await Promise.all(out.map(readEntry))).flat());
      out.push(...ents); more();
    }, () => ok([]));
    more();
  });
}
addEventListener('dragover', e => { e.preventDefault(); $('app').classList.add('drop-on'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('app').classList.remove('drop-on'); });
addEventListener('drop', async e => {
  e.preventDefault(); $('app').classList.remove('drop-on');
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  const files = entries.length ? (await Promise.all(entries.map(readEntry))).flat() : [...e.dataTransfer.files];
  const t = files.find(f => TPL_EXT.test(f.name));
  if (t) await loadTemplate(t);
  const imgs = files.filter(f => IMG_EXT.test(f.name));
  if (imgs.length) addImages(imgs);
});
