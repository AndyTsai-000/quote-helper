<title>估價單小幫手</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 版面：左邊三個步驟、右邊品項預覽；手機時上下排 */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --fg:#1d2621; --muted:#5f6d65; --line:#d8dfd9;
  --accent:#1f7a4d; --accent-fg:#ffffff; --accent-soft:#e3f1e8; --warn:#a2610a; --warn-soft:#fbefdc;
  --body:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --panel:#1c2420; --fg:#e4ebe6; --muted:#9aa9a0; --line:#2f3a34;
  --accent:#4cbf86; --accent-fg:#0d1b14; --accent-soft:#1d3528; --warn:#e6a64a; --warn-soft:#3a2c17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --panel:#1c2420; --fg:#e4ebe6; --muted:#9aa9a0; --line:#2f3a34;
  --accent:#4cbf86; --accent-fg:#0d1b14; --accent-soft:#1d3528; --warn:#e6a64a; --warn-soft:#3a2c17; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:26px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 24px;max-width:70ch}
.grid{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:780px){.grid{grid-template-columns:minmax(0,1fr)}}
.steps{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.step-h{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:10px}
.num{font-family:var(--mono);font-size:13px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.done .num{background:var(--accent);color:var(--accent-fg)}
.pick{display:block;border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;cursor:pointer;color:var(--muted)}
.pick:hover,.pick:focus-within{border-color:var(--accent);color:var(--fg)}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick b{color:var(--accent)}
.picked{margin-top:8px;font-size:14px;word-break:break-all}
.alt{font-size:13px;color:var(--muted);margin-top:6px}
.alt label{color:var(--accent);cursor:pointer;text-decoration:underline}
.alt input{display:none}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:14px}
.field small{font-size:12px;color:var(--muted)}
select,input[type=text]{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);max-width:60%}
input[type=text]{width:60%}
.mini{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--accent);background:var(--bg);white-space:nowrap}
.mini:hover,.mini:focus-within{border-color:var(--accent)}
.mini input{position:absolute;opacity:0;width:1px;height:1px}
.tplinfo{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:13px;display:flex;flex-direction:column;gap:2px}
.tpl-name{font-weight:700;color:var(--accent);word-break:break-all}
.tpl-meta{color:var(--muted);overflow-wrap:anywhere}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0;padding:8px 10px;border-radius:6px;background:var(--panel);font-weight:500;color:var(--fg)}
.ask .mini2{padding:3px 14px}
.ask .mini2.yes{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tpl-acts{display:flex;gap:14px}
.add-more{margin-top:12px;text-align:center}
.add-more .mini{display:inline-block;font-size:14px;padding:7px 18px}
button.link{align-self:flex-start;background:none;border:0;padding:0;margin-top:4px;color:var(--warn);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
button.go{width:100%;font:inherit;font-weight:700;font-size:16px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);cursor:pointer;margin-top:14px}
button.go:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:14px;margin-top:10px;min-height:1.2em}
.msg.err{color:var(--warn)}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.tag{font-size:12px;padding:2px 8px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:8px;font-weight:500}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
td.r{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;width:44px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs figure{margin:0;text-align:center;font-size:11px;color:var(--muted);max-width:90px}
.thumbs img,.ph{height:56px;width:auto;max-width:90px;border-radius:4px;border:1px solid var(--line);display:block;object-fit:contain;background:var(--bg)}
.ph{width:72px}
.thumbs figcaption{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumbs{position:relative}
button.del{position:absolute;top:-6px;right:-6px;z-index:1;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
button.del:hover,button.del:focus-visible{color:#fff;background:var(--warn);border-color:var(--warn)}
.undo{margin-top:4px;color:var(--muted);display:flex;gap:8px;align-items:center}
.drop-on .card{border-color:var(--accent)}
.muted{color:var(--muted)}
[hidden]{display:none!important}
.picked button.link{margin:0 0 0 6px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
input.nm{width:100%;max-width:none;font:inherit;font-size:14px;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:4px;color:var(--fg)}
input.nm:hover,input.nm:focus{border-color:var(--line);background:var(--bg)}
.ai-wait{font-size:12px;color:var(--accent);padding-left:6px}
input.nm.spec{font-size:12px;color:var(--muted);padding:2px 6px}
button.drag{cursor:grab;touch-action:none;background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:6px 6px 6px 0;vertical-align:middle}
button.drag:hover{color:var(--accent)}
tr.dragging{opacity:.45}
tr.drop-before td{box-shadow:inset 0 3px 0 var(--accent)}
tr.drop-after td{box-shadow:inset 0 -3px 0 var(--accent)}
body.reordering,body.reordering *{cursor:grabbing!important;user-select:none}
@media (max-width:520px){
  th,td{padding:6px 3px}
  .thumbs img,.ph{height:44px;max-width:56px}
  .thumbs figcaption{display:none}
  input.num{width:2.8em;padding:4px}
  input.num.price{width:4.6em}
  select.rm{margin-left:0;max-width:100%;font-size:11px}
  td.r{width:auto}
  .card{padding:12px}
  button.drag{padding:4px 2px 4px 0}
  .thumbs img,.ph{max-width:46px}
}
select.rm{font-size:12px;padding:1px 4px;margin:2px 0 0 6px;max-width:none;color:var(--muted)}
input.sz{width:7.5em;max-width:none;font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
/* 手機：每一項排成小卡片（品名／尺寸 材質／數量 單價，圖片在右邊），欄位名稱寫在格子上方 */
@media (max-width:520px){
  .tbl thead{display:none}
  #rows tr{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 60px;grid-template-areas:"r nm nm img" "r z mt img" "r q p img";gap:4px 8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
  #rows td{border:0;padding:0;min-width:0}
  #rows td.r{grid-area:r} #rows td.c-nm{grid-area:nm} #rows td.c-z{grid-area:z} #rows td.c-mt{grid-area:mt}
  #rows td.c-q{grid-area:q} #rows td.c-p{grid-area:p} #rows td.c-img{grid-area:img}
  #rows td[data-h]::before{content:attr(data-h);display:block;font-size:11px;color:var(--muted)}
  #rows input.sz,#rows input.num,#rows input.num.price{width:100%;font-size:16px}
  #rows .amt{text-align:left}
}
input.num{width:4.2em;max-width:none;font:inherit;font-size:14px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
input.num.price{width:6.5em}
td.amt{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.builtin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:13px}
.builtin button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--accent);border-radius:999px;background:var(--accent-soft);color:var(--accent);cursor:pointer}
button.link2{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--accent);text-decoration:underline;cursor:pointer}
button.link2:disabled{opacity:.4;cursor:not-allowed}
label.link2{font-size:13px;color:var(--accent);text-decoration:underline;cursor:pointer}
.link2.warn{color:var(--warn)}
.foot{margin-top:24px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg{background:var(--panel);color:var(--fg);border-radius:12px;width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;padding:16px;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;font-size:16px}
.dlg .x{background:none;border:0;font-size:18px;color:var(--muted);cursor:pointer}
.dlg-bar{display:flex;gap:8px}
.dlg-bar input{flex:1;max-width:none;width:auto}
.mini2{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}
.dlg-f{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.dlg-f .grow{flex:1}
button.go.small{width:auto;font-size:14px;padding:8px 16px;margin-top:0}
.libgrid{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;min-height:120px}
.libcard{border:1.5px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-size:13px;background:var(--bg);text-align:left;font-family:inherit;color:var(--fg)}
.libcard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.libcard img{width:100%;height:90px;object-fit:contain;background:#fff;border-radius:4px}
.libcard .p{color:var(--muted);font-size:12px}
#repText{width:100%;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);padding:8px;resize:vertical}
</style>

<div class="wrap" id="app">
  <h1>估價單小幫手</h1>
  <p class="sub">放入圖片或圖片資料夾，<span id="subName">品名用圖片檔名，可以直接修改</span>，產生 Excel 估價單或 PPT 簡報。可以放自己的範本（Excel、PDF 或 PPT），照範本的樣子做。檔案也可以直接拖進這個頁面。</p>

  <div class="grid">
    <div class="steps">
      <section class="card" id="s1">
        <div class="step-h"><span class="num">1</span>要產生什麼</div>
        <div class="field"><span>檔案類型</span><select id="qFmt">
          <option value="xlsx" selected>Excel 估價單</option>
          <option value="pptx">PPT 簡報</option>
        </select></div>
        <div class="field" id="tplPick"><span>範本 <small>（可不放）</small></span><label class="mini"><input type="file" id="tplFile" accept=".xlsx,.xlsm,.pdf,.pptx,.xls,.ppt,.ods,.odp,.numbers,.key">選 Excel／PDF／PPT</label></div>
        <div class="builtin" id="tplBuiltin" hidden></div>
        <div class="tplinfo" id="tplInfo" hidden></div>
        <div class="field" id="companyField"><span>公司名稱</span><input type="text" id="qCompany" placeholder="例：好家居設計"></div>
        <div class="field"><span>客戶名稱</span><input type="text" id="qClient" placeholder="例：王先生"></div>
        <div class="field" id="addrField"><span>地址</span><input type="text" id="qAddr" placeholder="例：台中市北屯區…"></div>
        <div class="field" id="phoneField"><span>聯絡電話</span><input type="text" id="qPhone" inputmode="tel" placeholder="例：0912-345-678"></div>
        <div class="field" id="taxField"><span>營業稅 5%</span><select id="qTax"><option value="0" selected>不加</option><option value="1">要加</option></select></div>
      </section>

      <section class="card" id="s2">
        <div class="step-h"><span class="num">2</span>圖片</div>
        <label class="pick"><input type="file" id="files" accept="image/*" multiple>點這裡選擇 <b>圖檔</b>（可一次選多張）</label>
        <div class="alt">或 <label for="folder">選擇圖片資料夾</label><input type="file" id="folder" webkitdirectory multiple>　再選一次會加進清單，依空間自動排好</div>
        <div class="picked" id="imgName"></div>
        <div class="field"><span>圖片處理</span><select id="imgProc">
          <option value="none">原圖</option>
          <option value="trim" selected>裁掉多餘的空白邊</option>
          <option value="cut">去背（純色背景的照片）</option>
        </select></div>
        <label class="check" id="aiField" hidden><input type="checkbox" id="aiOn" checked> 用 AI 看圖片取品名</label>
        <div class="msg" id="aiMsg"></div>
      </section>

      <section class="card" id="s3">
        <div class="step-h"><span class="num">3</span>產生</div>
        <div class="field" id="sizeField"><span>圖片大小</span><select id="size">
          <option value="60">小（60 像素高）</option>
          <option value="100" selected>中（100 像素高）</option>
          <option value="160">大（160 像素高）</option>
        </select></div>
        <label class="check"><input type="checkbox" id="libSave" checked> 自動記住改過的品名、尺寸、材質和單價（下次放同一張照片直接帶入）</label>
        <button class="go" id="go" disabled>下載 Excel 估價單</button>
        <div class="msg" id="msg"></div>
      </section>
    </div>

    <section class="card">
      <div class="step-h" style="margin-bottom:8px">產品資訊<span class="tag" id="sample">範例</span></div>
      <div class="sum" id="sum"></div>
      <div class="tbl"><table>
        <thead><tr><th>項次</th><th>品名</th><th>尺寸</th><th>材質</th><th id="thA">數量</th><th id="thB">單價</th><th>圖片</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div class="add-more" id="addMore" hidden><label class="mini" for="files" tabindex="0" role="button" id="addMoreBtn">＋ 加入圖檔</label></div>
    </section>
  </div>
  <footer class="foot">估價單小幫手　版本 <span id="ver"></span>　<button type="button" class="link2" id="reportBtn">回報問題</button></footer>
</div>

<div class="modal" id="repModal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="repTitle">
    <div class="dlg-h"><b id="repTitle">回報問題</b><button type="button" class="x" id="repClose" aria-label="關閉">✕</button></div>
    <p class="muted" style="margin:0 0 8px">下面是這次的狀況，按「複製」後貼給負責的人，再補一句哪裡不對。範本和產生的檔案也一起傳過去。</p>
    <textarea id="repText" rows="14" readonly></textarea>
    <div class="dlg-f"><button type="button" class="go small" id="repCopy">複製</button><span class="msg" id="repMsg"></span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const IMG_EXT = /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i;
const TPL_EXT = /\.(xlsx|xlsm|pdf|pptx|xls|ppt|ods|odp|numbers|key)$/i; // 舊格式也收，讀的時候說明怎麼另存
const EMU = 9525; // 1 像素 = 9525 EMU
const XLSX_TYPE = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
let images = [], tpl = null; // tpl = { kind, name, buf, spec }

// ---------- 小工具 ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const stemOf = name => name.replace(/\.[^.]+$/, '');
const flat = t => String(t ?? '').normalize('NFKC').replace(/\s+/g, '');
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
const range = (a, b) => Array.from({ length: Math.max(0, b - a + 1) }, (_, i) => a + i);
const fmtDate = (d, sep = '/') => [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join(sep);
const todayStr = sep => fmtDate(new Date(), sep);
function colLetter(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function showMsg(t, err) { $('msg').textContent = t; $('msg').classList.toggle('err', !!err); }
function cellText(cell) {
  if (cell.value instanceof Date) return fmtDate(cell.value);
  try { return cell.text ?? ''; } catch { return String(cell.value ?? ''); }
}

// 檔名去掉前後的編號和「複製」字樣，例如「01_沙發-2.jpg」「沙發 - 複製 (3).jpg」「Copy of 沙發(1).jpg」→「沙發」
const COPY_WORD = '(?:複製|複本|副本|拷貝|copy)';
function itemName(name) {
  const s = stemOf(name).trim();
  let t = s, prev;
  do {
    prev = t;
    t = t.replace(/^\d+[\s._\-、）)]+/, '')
      .replace(new RegExp(`^(?:${COPY_WORD}\\s*(?:of\\s+)?|${COPY_WORD}\\s*[-_]\\s*)`, 'i'), '')
      .replace(new RegExp(`[\\s_\\-－–]*[（(]?\\s*的?\\s*${COPY_WORD}\\s*\\d*\\s*[)）]?$`, 'i'), '')
      .replace(/(?:[\s_\-－–]\d{1,2}|\s*[（(]\s*\d{1,3}\s*[)）])$/, '')
      .trim();
  } while (t && t !== prev);
  return t || '未命名'; // 檔名只有「(1)」「複製」這類字
}
const labelOf = img => (img.label || '').trim() || itemName(img.name);

// ---------- 空間分組（PPT 同空間的家具放同一頁） ----------
const ROOMS = ['客廳', '餐廳', '臥室', '書房', '廚房', '衛浴', '玄關', '兒童房', '戶外', '其他'];
const ROOM_KEYS = [
  ['客廳', /沙發|茶几|電視櫃|邊几|邊桌|單椅|躺椅|主人椅|腳凳|地毯|落地燈/],
  ['餐廳', /餐桌|餐椅|餐邊櫃|餐櫃|酒櫃|吧檯|吧台/],
  ['臥室', /床|衣櫃|梳妝|化妝|斗櫃|床頭櫃|衣架/],
  ['書房', /書桌|書櫃|書架|辦公椅|電腦椅|工作桌/],
  ['廚房', /廚具|流理|冰箱|爐|抽油煙|電器櫃/],
  ['衛浴', /馬桶|浴|洗手|面盆|鏡櫃/],

async function aiBlob(file) {

}

  updateNames();
  let done = 0;
  for (let k = 0; k < list.length; k += aiMax) {
    const batch = list.slice(k, k + aiMax);
    setAiMsg(`AI 看圖取名中… ${done} / ${list.length}`);
    try {
      const blobs = await Promise.all(batch.map(i => aiBlob(i.file)));
      const names = await sampler.json(aiPrompt(batch), { images: blobs, modelTier: 'quick' });
      if (run !== aiRun) return;
      batch.forEach((img, j) => {
        const v = Array.isArray(names) ? names[j] : null;
        const n = String((v && typeof v === 'object' ? v.name : v) ?? '').trim().slice(0, 30);
        if (n && !img.edited) img.label = n;
        if (v && ROOMS.includes(v.room) && !img.roomEdited) img.room = v.room;
        if (v && typeof v.spec === 'string' && !img.specEdited) img.spec = v.spec.trim().slice(0, 40);
        img.ai = false; img.aiDone = true;
      });
      done += batch.length;
      applyMem();
      updateNames();
    } catch (e) {
      if (run !== aiRun) return;
      list.forEach(i => i.ai = false);
      updateNames();
      aiReason = `上次 AI 取名失敗（${e?.code || ''} ${e?.message || ''}）`.trim();
      if (AI_STOP.includes(e?.code)) {
        sampler = null; $('aiField').hidden = true;
        aiNote(e.code === 'not_granted' ? '沒有允許這個頁面使用 Claude（重新整理後按「允許」）' : `AI 不能用（${e.code}）`);
      }
      else setAiMsg(AI_ERR[e?.code] || 'AI 取名沒有完成，品名先用檔名，可以直接修改。', true);
      return;
    }
  }
  setAiMsg(`✓ AI 取好 ${done} 個品名，可以在右邊直接修改`);
  resort(); // AI 判斷出空間後，照空間重新排
}

function loadBitmap(file) {
  if (window.createImageBitmap) return createImageBitmap(file);
  return new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = URL.createObjectURL(file); });
}
// 高度 H 像素；有給 maxW 時寬度也不超過
async function prepImage(file, H, maxW = Infinity) {
  const bmp = await loadBitmap(file);
  const ratio = bmp.width / bmp.height;
  let w = H * ratio, h = H;
  if (w > maxW) { w = maxW; h = maxW / ratio; }
  w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
  // 存成顯示大小的 2 倍，清楚又不會讓檔案太大
  const k = Math.min(2, bmp.width / w);
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * k); cv.height = Math.round(h * k);
  const g = cv.getContext('2d');
  const png = /\.(png|gif|webp)$/i.test(file.name);
  if (!png) { g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); }
  g.drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, png ? 'image/png' : 'image/jpeg', 0.88));
  return { buffer: await blob.arrayBuffer(), extension: png ? 'png' : 'jpeg', w, h };
}
async function prepAll(items, H) {
  const out = [];
  for (let i = 0; i < items.length; i++) {
    showMsg(`處理圖片 ${i + 1} / ${items.length}…`);
    try { out.push(await prepImage(await srcOf(items[i]), H)); } catch { out.push(null); }
  }
  return out;
}

// ---------- 圖片處理：裁掉多餘的空白邊、去背 ----------
// 從照片四邊往內找跟背景同色、而且連在一起的區域，產品中間的白色不會被當成背景
async function processImage(file, mode) {
  const bmp = await loadBitmap(file);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const W = Math.max(1, Math.round(bmp.width * k)), H = Math.max(1, Math.round(bmp.height * k));
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.drawImage(bmp, 0, 0, W, H);
  const data = g.getImageData(0, 0, W, H), px = data.data;
  // 背景色：四個角裡最多角一樣的那個顏色；四角顏色都不同就不是純色背景，不處理
  const corners = [[0, 0], [W - 1, 0], [0, H - 1], [W - 1, H - 1]].map(([x, y]) => { const i = (y * W + x) * 4; return [px[i], px[i + 1], px[i + 2], px[i + 3]]; });
  const near = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]) < 45;
  let bg = corners[0], votes = 0;
  for (const c of corners) { const n = corners.filter(d => near(c, d)).length; if (n > votes) { votes = n; bg = c; } }
  const clearBg = corners.filter(c => c[3] < 16).length >= 2;
  if (votes < 2 && !clearBg) return null;
  const TOL = 60;
  const isBg = i => px[i + 3] < 16 || (!clearBg && Math.abs(px[i] - bg[0]) + Math.abs(px[i + 1] - bg[1]) + Math.abs(px[i + 2] - bg[2]) <= TOL);
  const mask = new Uint8Array(W * H), stack = [];
  const push = p => { if (!mask[p] && isBg(p * 4)) { mask[p] = 1; stack.push(p); } };
  for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
  for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
  while (stack.length) {
    const p = stack.pop(), x = p % W;
    if (x > 0) push(p - 1);
    if (x < W - 1) push(p + 1);
    if (p >= W) push(p - W);
    if (p < W * (H - 1)) push(p + W);
  }
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!mask[y * W + x]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const area = (x1 - x0 + 1) * (y1 - y0 + 1);
  if (area < W * H * 0.01) return null; // 幾乎都是背景，大概判斷錯了
  if (mode === 'trim' && area > W * H * 0.97) return null; // 沒有空白邊可以裁
  if (mode === 'cut') { for (let p = 0; p < W * H; p++) if (mask[p]) px[p * 4 + 3] = 0; g.putImageData(data, 0, 0); }
  const m = Math.round(Math.max(x1 - x0, y1 - y0) * 0.03); // 留一點邊
  x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(W - 1, x1 + m); y1 = Math.min(H - 1, y1 + m);
  const out = document.createElement('canvas');
  out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  const o = out.getContext('2d');
  const png = mode === 'cut' || /\.(png|gif|webp)$/i.test(file.name);
  if (!png) { o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height); }
  o.drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  const blob = await new Promise(r => out.toBlob(r, png ? 'image/png' : 'image/jpeg', 0.92));
  return new File([blob], stemOf(file.name) + (png ? '.png' : '.jpg'), { type: blob.type });
}
// 這張圖實際要用的檔案（依「圖片處理」的選擇，處理過的會記起來）；產品庫來的圖已經處理過
async function srcOf(img) {
  const mode = $('imgProc').value;
  if (mode === 'none' || img.lib) return img.file;
  img.proc = img.proc || {};
  if (!(mode in img.proc)) { try { img.proc[mode] = await processImage(img.file, mode); } catch { img.proc[mode] = null; } }
  return img.proc[mode] || img.file;
}
function thumbOf(img) {
  const mode = $('imgProc').value, f = mode !== 'none' && img.proc?.[mode];
  if (!f) return img.url;
  img.procUrl = img.procUrl || {};
  return img.procUrl[mode] = img.procUrl[mode] || URL.createObjectURL(f);
}
// 清單上的縮圖換成處理後的樣子
let thumbRun = 0;
async function processThumbs() {
  const run = ++thumbRun;
  for (const img of quoteItems()) {
    await srcOf(img);
    if (run !== thumbRun) return;
    const el = document.querySelector(`img[data-k="${CSS.escape(img.url)}"]`);
    if (el) el.src = thumbOf(img);
  }
}

// ---------- 數量、單價 ----------
const parseNum = s => { const v = parseFloat(String(s ?? '').replace(/[,，\s$＄NT元]/gi, '')); return Number.isFinite(v) ? v : null; };
const qtyOf = img => parseNum(img.qty) ?? 1;
const priceOf = img => parseNum(img.price);
// 規格欄（Excel）放尺寸和材質；PPT 品名下面那行小字
// PPT 品名下面條列（照使用者 2026-10-27 改過的李公館簡報）：一行「尺寸：…」、一行「材質：…」，沒填的不寫
const detailLines = img => [(img.size || '').trim() && '尺寸：' + img.size.trim(), (img.spec || '').trim() && '材質：' + img.spec.trim()].filter(Boolean);
const detailOf = img => detailLines(img).join('\n');
// Excel：尺寸、材質不加標籤（照使用者改過的李公館估價單）；儲存格裡不換行（使用者 2026-10-30 要求）
const specVals = img => [img.size, img.spec].map(x => (x || '').trim()).filter(Boolean);
const specOneLine = img => specVals(img).join('　'); // 只有一個「規格」格時放同一行
const money = v => v == null ? '' : 'NT$ ' + Math.round(v).toLocaleString('en-US');
function updateTotals() {
  const items = quoteItems();
  items.forEach((img, n) => { const a = $('a' + n); if (a) a.textContent = priceOf(img) == null ? '' : money(qtyOf(img) * priceOf(img)); });

// ---------- 記住照片用過的名稱（存在這台電腦的瀏覽器裡） ----------
// 用照片內容算出指紋，同一張照片就算改了檔名也認得
let memCache = new Map();  // 指紋 → { name, price, room, spec }
let memByName = new Map(); // 品名 → 最近一次的單價（不同照片但同名也帶入單價）
const nameKey = name => flat(name).toLowerCase();
async function memLoad() {
  // 上次關網頁時來不及寫進資料庫的，先補進去
  try {
    const pend = JSON.parse(localStorage.getItem('xlsimg-mempend') || '[]');
    for (const r of pend) await Store.put('memory', r);
    localStorage.removeItem('xlsimg-mempend');
  } catch {}
  const list = (await Store.all('memory')) || [];
  memCache = new Map(list.map(r => [r.hash, r]));
  memByName = new Map(list.filter(r => r.name && r.price != null).sort((a, b) => a.updated - b.updated).map(r => [nameKey(r.name), r]));
}
async function hashOf(img) {
  if (img.hash) return img.hash;
  try {
    const d = await crypto.subtle.digest('SHA-256', await img.file.arrayBuffer());
    img.hash = [...new Uint8Array(d)].slice(0, 16).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch { img.hash = 'n:' + img.file.name + '|' + img.file.size; } // 不能算指紋時用檔名＋大小
  return img.hash;
}
// 同一張照片：帶入上次的品名、單價、規格、空間（AI 就不再重取）；不同照片但同名：帶入單價
function applyMem() {
  for (const img of images) {
    const r = img.hash && memCache.get(img.hash);
    if (r && !img.memApplied) {
      img.memApplied = true;
      // 只有記過真正品名的照片才跳過 AI；上次只是用檔名代替的，這次照樣交給 AI 取名
      // v2 之前的紀錄可能把檔名當品名記下來，那種品名不採用
      if (r.name && r.v >= 2 && !img.edited) { img.label = r.name; img.aiDone = true; img.fromMem = true; }
      if (!img.priceEdited && r.price != null) { img.price = r.price; img.priceFromLib = true; }
      if (!img.specEdited && r.spec) img.spec = r.spec;
      if (!img.sizeEdited && r.size) img.size = r.size;
      if (!img.roomEdited && r.room) img.room = r.room;
    }
    const p = memByName.get(nameKey(labelOf(img)));
    if (p && !img.priceEdited && (img.price === '' || img.priceFromLib)) { img.price = p.price; img.priceFromLib = true; }
  }
}
function memRecord(img) {
  // 品名是 AI 取的、自己改的或之前記住的才記；只是檔名代替的不記，免得下次擋掉 AI 取名
  const real = img.edited || img.aiDone || img.fromMem;
  const name = real ? labelOf(img).trim() : '';
  const price = priceOf(img), spec = (img.spec || '').trim(), size = (img.size || '').trim();
  const old = memCache.get(img.hash);
  if (!name && price == null && !spec && !size && !old) return null; // 記過的照片欄位清空也要存，下次才不會帶回舊內容
  return { v: 2, hash: img.hash, name: name || (old?.v >= 2 ? old.name : '') || '', price, room: img.room || '', spec, size, updated: Date.now() };
}
async function memSave(items) {
  for (const img of items) {
    await hashOf(img);
    const rec = memRecord(img);
    if (rec) await Store.put('memory', rec);
  }
  await memLoad();
}
// 改完馬上記住（使用者 2026-10-31 要求，不用按下載）：停手半秒就存；關網頁、切走前把還沒存的存好
const memDirty = new Set();
let memTimer = 0;
function memFlush() {
  clearTimeout(memTimer);
  if (!memDirty.size) return;
  const list = [...memDirty];
  memDirty.clear();
  if ($('libSave').checked) memSave(list).catch(e => errLog.push('memSave: ' + (e?.message || e)));
}
function memTouch(img) {
  memDirty.add(img);
  clearTimeout(memTimer);
  memTimer = setTimeout(memFlush, 500);
}
// 關網頁時資料庫可能來不及寫完，先同步存一份，下次打開由 memLoad 補進去
addEventListener('pagehide', () => {
  if (!memDirty.size || !$('libSave').checked) return;
  try { localStorage.setItem('xlsimg-mempend', JSON.stringify([...memDirty].filter(i => i.hash).map(memRecord).filter(Boolean))); } catch {}
  memFlush();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) memFlush(); });

    + `<td class="c-z" data-h="尺寸"><input type="text" class="sz" size="5" id="z${n}" placeholder="例 200×90×85" aria-label="第 ${n + 1} 項尺寸"></td><td class="c-mt" data-h="材質"><input type="text" class="sz" size="5" id="mt${n}" placeholder="例 灰色布面" aria-label="第 ${n + 1} 項材質"></td>`
    + (ppt ? ''

        + `<td class="c-p" data-h="單價"><input class="num price" size="4" id="p${n}" inputmode="decimal" placeholder="未填" aria-label="第 ${n + 1} 項單價"><div class="amt" id="a${n}"></div></td>`)
    + `<td class="c-img"><div class="thumbs"><button type="button" class="del" data-n="${n}" aria-label="刪除第 ${n + 1} 項" title="刪除這張">✕</button><figure><img src="${thumbOf(i)}" data-k="${esc(i.url)}" alt=""><figcaption title="${esc(i.name)}">${esc(i.name)}</figcaption></figure></div></td></tr>`).join('');
  items.forEach((img, n) => {
    const box = $('nm' + n);
    box.addEventListener('input', () => { img.label = box.value; img.edited = true; updateNames(); memTouch(img); });
    box.addEventListener('change', () => { applyMem(); if (!resort()) updateNames(); }); // 改好品名後，產品庫有同名的就帶入單價；空間可能跟著變，重新排
    $('rm' + n).addEventListener('change', e => { img.room = e.target.value; img.roomEdited = true; img.placed = false; memTouch(img); resort(); }); // 換空間就移到那個空間的位置
    const on = (id, fn) => $(id + n)?.addEventListener('input', e => fn(e.target.value));
    on('mt', v => { img.spec = v; img.specEdited = true; memTouch(img); }); // 材質（AI 看圖寫的也放這裡）
    on('z', v => { img.size = v; img.sizeEdited = true; memTouch(img); });
    on('q', v => { img.qty = v; updateTotals(); });
    on('p', v => { img.price = v; img.priceEdited = true; img.priceFromLib = false; updateTotals(); memTouch(img); });
  });
  updateNames();
}
// ---------- 拖曳調整順序（滑鼠、手指都可以；鍵盤按上下鍵） ----------
function moveItem(from, to) {
  if (from === to || to < 0 || to >= images.length) return false;
  const [it] = images.splice(from, 1);
  images.splice(to, 0, it);
  images.forEach(i => i.placed = true); // 自己排過的順序，之後自動排序不再動
  refresh();
  return true;
}
let drag = null;
$('rows').addEventListener('pointerdown', e => {
  const h = e.target.closest('.drag');
  if (!h || !images.length) return;
  e.preventDefault();
  drag = { from: +h.dataset.n, ins: +h.dataset.n, y: e.clientY };
  h.closest('tr').classList.add('dragging');
  document.body.classList.add('reordering');
  try { h.setPointerCapture(e.pointerId); } catch {}
});
function dragMark(y) {
  const rows = [...$('rows').children];
  // 插在哪一列前面：第一列中線在手指下方的那列；都在上方就放最後
  let ins = rows.findIndex(r => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; });
  if (ins < 0) ins = rows.length;
  drag.ins = ins;
  const noop = ins === drag.from || ins === drag.from + 1;
  rows.forEach((r, i) => {
    r.classList.toggle('drop-before', !noop && i === ins);
    r.classList.toggle('drop-after', !noop && ins === rows.length && i === rows.length - 1);
  });
}
$('rows').addEventListener('pointermove', e => {
  if (!drag) return;
  drag.y = e.clientY;
  dragMark(e.clientY);
  // 拖到畫面上下邊緣時自動捲動
  if (!drag.timer) drag.timer = setInterval(() => {
    if (!drag) return;
    const edge = 60, v = drag.y < edge ? -(edge - drag.y) / 3 : drag.y > innerHeight - edge ? (drag.y - innerHeight + edge) / 3 : 0;
    if (v) { scrollBy(0, v); dragMark(drag.y); }
  }, 16);
});
function dragEnd(apply) {
  if (!drag) return;
  clearInterval(drag.timer);
  const { from, ins } = drag;
  drag = null;
  document.body.classList.remove('reordering');
  [...$('rows').children].forEach(r => r.classList.remove('dragging', 'drop-before', 'drop-after'));
  if (apply && !moveItem(from, ins > from ? ins - 1 : ins)) refresh();
}
$('rows').addEventListener('pointerup', () => dragEnd(true));
$('rows').addEventListener('click', e => { const b = e.target.closest('.del'); if (b) deleteItem(+b.dataset.n); });
$('rows').addEventListener('pointercancel', () => dragEnd(false));
$('rows').addEventListener('keydown', e => {
  const h = e.target.closest('.drag');
  if (!h || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;
  e.preventDefault();
  const n = +h.dataset.n, to = n + (e.key === 'ArrowUp' ? -1 : 1);
  if (moveItem(n, to)) $('rows').querySelector(`.drag[data-n="${to}"]`)?.focus();
});

// 只更新品名欄，正在打字的那格不動
function updateNames() {
  quoteItems().forEach((img, n) => {
    const box = $('nm' + n);
    if (!box) return;
    if (document.activeElement !== box) box.value = img.label;
    box.nextElementSibling.hidden = !img.ai;
    const put = (id, v) => { const el = $(id + n); if (el && document.activeElement !== el) el.value = v; };
    put('mt', img.spec || ''); put('z', img.size || '');
    const rm = $('rm' + n);
    if (document.activeElement !== rm) rm.value = roomOf(img);
    put('q', img.qty ?? 1); put('p', img.price ?? '');
  });
  updateTotals();
}

// ---------- 記住範本（存在這台電腦的瀏覽器裡） ----------
const Store = {
  db: null,
  open() {
    if (this.db) return this.db;
    this.db = new Promise((ok, bad) => {
      // 第 3 版：照片記憶 memory（用照片指紋當 key）；第 2 版試做的產品庫 products 拿掉
      const r = indexedDB.open('quote-helper', 3);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (db.objectStoreNames.contains('products')) db.deleteObjectStore('products');
        if (!db.objectStoreNames.contains('memory')) db.createObjectStore('memory', { keyPath: 'hash' });
      };
      r.onsuccess = () => ok(r.result);
      r.onerror = () => bad(r.error);
    });
    return this.db;
  },
  async run(mode, fn, store = 'kv') {
    try {
      const db = await this.open();
      return await new Promise(ok => { const q = fn(db.transaction(store, mode).objectStore(store)); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); });
    } catch { return null; }
  },
  get(k) { return this.run('readonly', s => s.get(k)); },
  set(k, v) { return this.run('readwrite', s => s.put(v, k)); },
  del(k, store = 'kv') { return this.run('readwrite', s => s.delete(k), store); },
  all(store) { return this.run('readonly', s => s.getAll(), store); },
  put(store, v) { return this.run('readwrite', s => s.put(v), store); },
};
// 只有按「是」設成固定範本的才存，下次打開自動載入
function saveTpl() { if (tpl?.fixed) Store.set('tpl', { kind: tpl.kind, name: tpl.name, buf: tpl.buf, spec: tpl.spec }); }

async function normalizeOoxml(buf, ext) {
  const h = new Uint8Array(buf.slice(0, 4));
  if (h[0] === 0xD0 && h[1] === 0xCF && h[2] === 0x11 && h[3] === 0xE0) // 加密或舊格式改了副檔名
    throw new Error('這個檔案有密碼保護，或其實是舊格式。請在 Office 打開、移除密碼（檔案 → 資訊 → 保護）後，「另存新檔」成 .xlsx／.pptx 再放進來。');
  if (!(h[0] === 0x50 && h[1] === 0x4B)) throw new Error('這個檔案讀不出來，可能已經損毀。請用 Office 打開後「另存新檔」再試。');
  const JSZip = await loadLib('jszip');
  const z = await JSZip.loadAsync(buf.slice(0));
  const main = z.file('xl/workbook.xml') || z.file('ppt/presentation.xml');
  if (!main) throw new Error(ext === 'pptx' ? '這個檔案不是 PPT 簡報。' : '這個檔案不是 Excel 活頁簿。');
  if (!(await main.async('string')).includes('purl.oclc.org/ooxml')) return buf;
  for (const f of Object.keys(z.files).filter(f => /\.(xml|rels)$/i.test(f))) {
    let s = await z.file(f).async('string');
    if (!s.includes('purl.oclc.org/ooxml')) continue;
    for (const [a, b] of STRICT_NS) s = s.split(a).join(b);
    z.file(f, s.replace(/ conformance="strict"/g, ''));
  }
  return z.generateAsync({ type: 'arraybuffer' });
}

// ExcelJS 把工作表設定 <sheetPr> 裡的「每頁縮放」（pageSetUpPr）寫在「大綱」（outlinePr）前面，
// 順序不對 Excel 打開就要修復（使用者 2026-10-30 回報：範本兩個都有時才會發生）。存完照規定的順序排回去
async function fixSheetPr(buf) {
  const JSZip = await loadLib('jszip'), z = await JSZip.loadAsync(buf), ORDER = ['tabColor', 'outlinePr', 'pageSetUpPr'];
  let changed = false;
  for (const k of Object.keys(z.files).filter(k => /^xl\/worksheets\/sheet\d+\.xml$/.test(k))) {
    const x = await z.file(k).async('string');
    const y = x.replace(/<sheetPr([^>]*)>([\s\S]*?)<\/sheetPr>/, (m, attrs, inner) => {
      const kids = inner.match(/<(tabColor|outlinePr|pageSetUpPr)\b[^>]*\/>/g) || [];
      if (kids.join('') !== inner) return m; // 有其他寫法就不動
      kids.sort((a, b) => ORDER.indexOf(a.match(/<(\w+)/)[1]) - ORDER.indexOf(b.match(/<(\w+)/)[1]));
      return `<sheetPr${attrs}>${kids.join('')}</sheetPr>`;
    });
    if (y !== x) { z.file(k, y); changed = true; }
  }
  return changed ? z.generateAsync({ type: 'arraybuffer', compression: 'DEFLATE' }) : buf;
}
// ExcelJS 存檔會把範本裡的文字框、圖形、線條弄丟：存完再從範本補回去（範本插過列的話位置跟著往下移）
// 圖表、SmartArt 沒辦法補，回傳數量讓畫面提醒
async function keepShapes(tplBuf, outBuf, shifts) {
  const JSZip = await loadLib('jszip');
  const [a, b] = await Promise.all([JSZip.loadAsync(tplBuf.slice(0)), JSZip.loadAsync(outBuf)]);
  const SML = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', XDR = 'http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing';
  const sheetsOf = async z => {
    const wbx = parseXml(await z.file('xl/workbook.xml').async('string')), rels = parseXml(await z.file('xl/_rels/workbook.xml.rels').async('string'));
    const out = {};
    for (const s of wbx.getElementsByTagNameNS(SML, 'sheet')) {
      const rel = relsOf(rels).find(r => r.getAttribute('Id') === s.getAttributeNS(NS.r, 'id'));
      if (rel) out[s.getAttribute('name')] = resolvePath('xl/workbook.xml', rel.getAttribute('Target'));
    }
    return out;
  };
  const A = await sheetsOf(a), B = await sheetsOf(b);
  const ct = parseXml(await b.file('[Content_Types].xml').async('string'));
  let kept = 0, lost = 0;
  for (const [name, pa] of Object.entries(A)) {
    const pb = B[name];
    const ra = a.file(relsPath(pa)) && parseXml(await a.file(relsPath(pa)).async('string'));
    const dRel = ra && relsOf(ra).find(r => /\/drawing$/.test(r.getAttribute('Type')));
    if (!pb || !dRel) continue;
    const dDoc = parseXml(await a.file(resolvePath(pa, dRel.getAttribute('Target'))).async('string'));
    const anchors = [];
    for (const an of [...dDoc.documentElement.children]) {
      const obj = [...an.children].find(c => ['sp', 'grpSp', 'cxnSp', 'graphicFrame', 'pic', 'contentPart'].includes(c.localName));
      if (!obj || obj.localName === 'pic') continue; // 圖片 ExcelJS 自己會保留
      // 用到其他檔案（圖表、圖片填滿、超連結）的補不回來
      const refs = [...an.getElementsByTagName('*')].some(e => [...e.attributes].some(at => at.namespaceURI === NS.r));
      if (obj.localName === 'graphicFrame' || obj.localName === 'contentPart' || refs) { lost++; continue; }
      for (const tag of ['from', 'to']) {
        const row = an.getElementsByTagNameNS(XDR, tag)[0]?.getElementsByTagNameNS(XDR, 'row')[0];
        if (!row) continue;
        let r0 = +row.textContent;
        for (const s of shifts[name] || []) if (r0 >= s.L) r0 += s.n; // s.L 是插入點上面那列（從 1 算）
        row.textContent = String(r0);
      }
      anchors.push(an);
    }
    if (!anchors.length) continue;
    // 輸出檔裡這張工作表的 drawing：有就加在後面，沒有就新建一個
    const rbPath = relsPath(pb);
    const rb = b.file(rbPath) ? parseXml(await b.file(rbPath).async('string')) : parseXml(`<Relationships xmlns="${REL_NS}"/>`);
    let dbRel = relsOf(rb).find(r => /\/drawing$/.test(r.getAttribute('Type'))), dbPath, dbDoc;
    if (dbRel) { dbPath = resolvePath(pb, dbRel.getAttribute('Target')); dbDoc = parseXml(await b.file(dbPath).async('string')); }
    else {
      let k = 1; while (b.file(`xl/drawings/drawing${k}.xml`)) k++;
      dbPath = `xl/drawings/drawing${k}.xml`;
      dbDoc = parseXml(`<xdr:wsDr xmlns:xdr="${XDR}" xmlns:a="${NS.a}" xmlns:r="${NS.r}"/>`);
      const rel = rb.createElementNS(REL_NS, 'Relationship');
      rel.setAttribute('Id', 'rIdShapes1'); rel.setAttribute('Type', REL_T + 'drawing'); rel.setAttribute('Target', `../drawings/drawing${k}.xml`);
      rb.documentElement.appendChild(rel);
      b.file(rbPath, xmlStr(rb));
      const o = ct.createElementNS(CT_NS, 'Override');
      o.setAttribute('PartName', '/' + dbPath); o.setAttribute('ContentType', 'application/vnd.openxmlformats-officedocument.drawing+xml');
      ct.documentElement.appendChild(o);
      // 工作表裡加 <drawing r:id>，要放在規定的位置（pageSetup、headerFooter、分頁之後）
      const sx = parseXml(await b.file(pb).async('string')), root = sx.documentElement;
      const d = sx.createElementNS(SML, 'drawing');
      d.setAttributeNS(NS.r, 'r:id', 'rIdShapes1');
      const after = ['legacyDrawing', 'legacyDrawingHF', 'drawingHF', 'picture', 'oleObjects', 'controls', 'webPublishItems', 'tableParts', 'extLst'];
      root.insertBefore(d, [...root.children].find(c => after.includes(c.localName)) || null);
      b.file(pb, xmlStr(sx));
    }
    let id = Math.max(0, ...[...dbDoc.getElementsByTagNameNS(XDR, 'cNvPr')].map(e => +e.getAttribute('id') || 0));
    for (const an of anchors) {
      const node = dbDoc.importNode(an, true);
      [...node.getElementsByTagNameNS(XDR, 'cNvPr')].forEach(e => e.setAttribute('id', String(++id)));
      dbDoc.documentElement.appendChild(node);
      kept++;
    }
    b.file(dbPath, xmlStr(dbDoc));
  }
  if (!kept) return { buf: outBuf, kept, lost };
  b.file('[Content_Types].xml', xmlStr(ct));
  return { buf: await b.generateAsync({ type: 'arraybuffer' }), kept, lost };
}

async function loadTemplate(file) {
  const ext = (file.name.match(/\.([^.]+)$/) || [])[1]?.toLowerCase();
  showMsg('讀取範本…');
  try {
    if (OLD_FMT[ext]) throw new Error(OLD_FMT[ext]);
    let buf = await file.arrayBuffer();
    if (ext !== 'pdf') buf = await normalizeOoxml(buf, ext);
    let kind, spec;
    if (ext === 'xlsx' || ext === 'xlsm') { kind = 'xlsx'; spec = await specFromXlsx(buf); }
    else if (ext === 'pdf') { kind = 'pdf'; spec = await specFromPdf(buf); }
    else if (ext === 'pptx') { kind = 'pptx'; spec = await specFromPptx(buf); }
    else throw new Error('範本只能用 Excel（.xlsx）、PDF 或 PPT（.pptx）。');
    tpl = { kind, name: file.name, buf, spec, ask: true }; // 問要不要設成固定範本
    if (kind === 'xlsx' || kind === 'pptx') $('qFmt').value = kind;
    else if ($('qFmt').value === 'pptx') $('qFmt').value = 'xlsx';
    showMsg('');
    if (kind === 'xlsx') aiMapColumns();
  } catch (e) {
    tpl = null;
    showMsg(e.message, true);
  }
  $('tplFile').value = '';
  renderOptions();
}

// Excel：找出表格標題列（例如「項次、品名、數量、單價、金額」）和合計列
function masterCells(ws, r) {
  const out = [];
  ws.getRow(r).eachCell({ includeEmpty: false }, (cell, col) => {
    if (cell.isMerged && cell.master.address !== cell.address) return;
    const text = cellText(cell).trim();
    if (text) out.push({ col, text, cell });
  });
  return out;
}
const mergeSpan = (ws, cell) => { const m = ws._merges[cell.address]; return m ? m.right - m.left + 1 : 1; };
// 品項列裡某一欄已有的內容（合併格只算一次）
function colValues(ws, col, rows) {
  return rows.map(k => { const c = ws.getCell(k, col); return c.isMerged && c.master.row !== k ? '' : cellText(c.master).trim(); }).filter(Boolean);
}
const isSeq = v => v.length >= 2 && v.every(x => /^\d+$/.test(x)) && v.every((x, i) => i === 0 || +x === +v[i - 1] + 1);
const AI_ROLES = ['index', 'name', 'name_image', 'spec', 'size', 'material', 'image', 'qty', 'unit', 'price', 'amount'];

// map：AI 判斷的欄位用途，例如 {A:'index', B:'name', C:'image'}，有的話以它為準
function findTable(wb, map) {
  for (const ws of wb.worksheets) {
    if (ws.state && ws.state !== 'visible') continue;
    const t = findTableIn(ws, map);
    if (t) return t;
  }
  return null;
}
function findTableIn(ws, map) {
  {
    for (let r = 1; r <= Math.min(ws.rowCount, 80); r++) {
      const cells = masterCells(ws, r);
      if (!isHeader(cells.map(c => c.text))) continue;
      let tot = null, totEnd = null;
      for (let k = r + 1; k <= ws.rowCount; k++) {
        if (TOTAL_RE.test(masterCells(ws, k).map(c => c.text).join(' '))) { tot = tot || k; totEnd = k; }
        else if (tot) break;
      }
      const sampleRows = range(r + 1, tot ? tot - 1 : Math.min(ws.rowCount, r + 30));
      const hints = cells.map(c => isSeq(colValues(ws, c.col, sampleRows)) ? 'index' : null);
      const roles = withRoles(cells.map(c => c.text), hints);
      const cols = cells.map((c, i) => ({ col: c.col, span: mergeSpan(ws, c.cell), name: c.text.replace(/\s+/g, ' '), role: roles[i].role, alsoImage: !!roles[i].alsoImage }));
      const minCol = cols[0].col, maxCol = Math.max(...cols.map(c => c.col + c.span - 1));
      const covered = () => new Set(cols.flatMap(c => range(c.col, c.col + c.span - 1)));

      if (map) {
        cols.forEach(c => {
          const m = map[colLetter(c.col)];
          if (!m) return;
          c.alsoImage = m === 'name_image';
          c.role = c.alsoImage ? 'name' : AI_ROLES.includes(m) ? m : 'other';
        });
        // AI 指定的品名欄或圖片欄如果標題是空白的，也加進來
        for (const [letter, role] of Object.entries(map)) {
          const k = colNum(letter);
          if (['name', 'image'].includes(role) && k >= minCol && k <= maxCol && !covered().has(k)) cols.push({ col: k, span: 1, name: '', role });
        }
        const seen = new Set();
        cols.forEach(c => { if (c.role !== 'other' && seen.has(c.role)) c.role = 'other'; seen.add(c.role); });
      }
      // 還是沒有品名欄：用最寬的一般欄，或標題空白的欄
      if (!cols.some(c => c.role === 'name')) {
        const wide = c => range(c.col, c.col + c.span - 1).reduce((a, k) => a + colPx(ws, k), 0);
        const cand = cols.filter(c => c.role === 'other' && !/備註|規格|尺寸|樣式|單位/.test(flat(c.name))).sort((a, b) => wide(b) - wide(a))[0];
        const blank = range(minCol, maxCol).find(k => !covered().has(k));
        if (cand) cand.role = 'name';
        else if (blank) cols.push({ col: blank, span: 1, name: '', role: 'name' });
      }
      // 沒有明寫圖片欄時看格子結構：品名格下面、同一個品項裡還有一塊空的合併格，就是放圖片的地方
      // （例如品名 B6:C6、下面 B7:C13 合併，標題寫「名稱及規格」也一樣）
      const nameC = cols.find(c => c.role === 'name');
      const keyC = cols.find(c => c.role === 'index') || cols.find(c => c.role === 'qty') || cols.find(c => c.role === 'amount');
      if (nameC && keyC && !nameC.alsoImage && !cols.some(c => c.role === 'image')) {
        const r0 = r + 1, km = ws._merges[ws.getCell(r0, keyC.col).master.address], nm = ws._merges[ws.getCell(r0, nameC.col).master.address];
        const bb = km ? km.bottom : r0, nb = nm ? nm.bottom : r0;
        if (bb > nb && isBlank(ws.getCell(nb + 1, nameC.col))) nameC.alsoImage = true;
      }
      cols.sort((a, b) => a.col - b.col);
      return { ws, h: r, cols, minCol, maxCol, tot, totEnd };
    }
  }
  return null;
}
const colNum = s => [...s.replace(/\$/g, '')].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0);
const colTitle = c => c.name || `${colLetter(c.col)} 欄`;

// AI 看範本每一欄的標題和已有的內容，判斷要填什麼
async function aiMapColumns() {
  if (!sampler || tpl?.kind !== 'xlsx' || tpl.aiBusy) return;
  const mine = tpl;
  mine.aiBusy = true; renderOptions();
  try {
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(mine.buf.slice(0));
    const t = findTable(wb);
    if (!t) return;
    const ws = t.ws, rows = range(t.h + 1, t.tot ? t.tot - 1 : Math.min(ws.rowCount, t.h + 15));
    const lines = range(t.minCol, t.maxCol).filter(c => { const h = ws.getCell(t.h, c); return !h.isMerged || h.master.col === c; }).map(c => {
      const head = cellText(ws.getCell(t.h, c).master).trim();
      const vals = colValues(ws, c, rows).slice(0, 4);
      // 這一欄在第一個品項裡怎麼合併（例如品名一格、下面三格合併放圖）
      const shape = [];
      for (let k = t.h + 1, n = 0; k <= Math.min(rows[rows.length - 1] || t.h, t.h + 12) && n < 3; n++) {
        const m = ws._merges[ws.getCell(k, c).master.address];
        const b = m ? m.bottom : k;
        shape.push(b > k ? `第 ${k}～${b} 列合併` : `第 ${k} 列`);
        k = b + 1;
      }
      return `${colLetter(c)} 欄：標題「${head || '（空白）'}」，寬約 ${colPx(ws, c)} 像素，格子：${shape.join('、')}，範本裡已有的內容：${vals.length ? vals.join('、') : '（空白）'}`;
    });
    const map = await sampler.json(`這是一份 Excel 估價單範本的表格（標題列在第 ${t.h} 列），一個品項可能佔一列，也可能佔好幾列。請判斷每一欄是用來填什麼。
${lines.join('\n')}

用途只能是：index（項次編號）、name（品項名稱）、name_image（同一欄上面寫品名、下面放圖片，例如標題「名稱及圖片」）、size（只寫尺寸的欄）、material（只寫材質的欄）、spec（規格，尺寸材質寫在同一欄）、image（放產品圖片）、qty（數量）、unit（單位）、price（單價）、amount（金額＝數量×單價）、other（其他，例如備註）。
判斷原則：範本裡已經填好 1、2、3 這種連號的欄是 index，不是品名。標題寫「項目」但內容是編號，就是 index。標題同時有名稱和圖片，或品名格下面接著一塊合併的大格子，就是 name_image。備註欄不放圖片。標題空白但很寬的欄，通常是放圖片或品名。每種用途最多一欄，一定要有 name 或 name_image。
只回 JSON 物件，鍵是欄號，值是用途，例如 {"A":"index","B":"name_image","C":"qty","D":"price","E":"amount","F":"other"}。`, { modelTier: 'quick' });
    if (tpl !== mine || !map || typeof map !== 'object') return;
    const clean = {};
    for (const [k, v] of Object.entries(map)) if (/^[A-Z]{1,3}$/.test(k)) clean[k] = AI_ROLES.includes(v) ? v : 'other';
    if (!Object.values(clean).some(v => v === 'name' || v === 'name_image')) return;
    mine.spec = await specFromXlsx(mine.buf, clean);
    mine.spec.map = clean;
    if (tpl === mine) saveTpl();
  } catch { /* AI 判斷不了就用原本的判斷 */ }
  finally { mine.aiBusy = false; if (tpl === mine) renderOptions(); }
}
async function specFromXlsx(buf, map) {
  const wb = new ExcelJS.Workbook();
  try { await wb.xlsx.load(buf.slice(0)); } catch { throw new Error('這個 Excel 範本打不開，可能有密碼保護或檔案損毀。'); }
  const t = findTable(wb, map);
  if (!t) throw new Error('Excel 範本裡找不到表格的標題列，標題列要有「品名」「數量」「單價」這類欄位名稱。');
  const line = r => masterCells(t.ws, r).map(c => c.text).join('　');
  const head = range(1, t.h - 1).map(line).filter(Boolean);
  const notes = t.totEnd ? range(t.totEnd + 1, t.ws.rowCount).map(line).filter(Boolean) : [];
  const ir = itemRows(t.ws, t);
  const { list } = pickSheet(wb, map, 0);
  return {
    head, notes, slots: list.length > 1 ? Math.max(...list.map(s => s.cap)) : ir.open ? Infinity : ir.rows.length, imgAt: pickImageCol(t).why,
    sheets: list.length > 1 ? list.map(s => ({ name: s.ws.name, cap: s.cap })) : null,
    cols: t.cols.map(c => ({ name: c.name || ROLE_LABEL[c.role] || '', role: c.role, alsoImage: c.alsoImage, letter: colLetter(c.col) })),
  };
}

// PDF：讀出每一行文字，找標題列，上面是抬頭、合計下面是備註
async function specFromPdf(buf) {
  const pdfjs = await loadLib('pdf');
  pdfjs.GlobalWorkerOptions.workerSrc = PDF_WORKER;
  let pdf;
  try { pdf = await pdfjs.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise; }
  catch { throw new Error('這個 PDF 打不開，可能有密碼保護或檔案損毀。'); }
  const lines = [];
  for (let n = 1; n <= Math.min(pdf.numPages, 3); n++) {
    const tc = await (await pdf.getPage(n)).getTextContent();
    const its = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ x: i.transform[4], y: i.transform[5], w: i.width, s: i.str }));
    its.sort((a, b) => b.y - a.y || a.x - b.x);
    let cur = null;
    for (const it of its) {
      if (!cur || Math.abs(cur.y - it.y) > 3) { cur = { y: it.y, items: [] }; lines.push(cur); }
      cur.items.push(it);
    }
  }
  const cellsOf = line => {
    const out = [];
    for (const it of line.items.sort((a, b) => a.x - b.x)) {
      const last = out[out.length - 1];
      if (last && it.x - (last.x + last.w) < 6) { last.s += it.s; last.w = it.x + it.w - last.x; }
      else out.push({ ...it });
    }
    return out.flatMap(c => c.s.split(/\s{2,}|　+/)).map(s => s.trim()).filter(Boolean);
  };
  const L = lines.map(cellsOf).filter(c => c.length);
  if (!L.length) throw new Error('這個 PDF 讀不到文字（可能是掃描的圖片），請改用 Excel 範本。');
  const text = c => c.join('　');
  const h = L.findIndex(isHeader);
  if (h < 0) return { head: L.slice(0, 6).map(text), cols: [], notes: [] };
  let totEnd = -1;
  for (let k = h + 1, started = false; k < L.length; k++) {
    if (TOTAL_RE.test(text(L[k]))) { started = true; totEnd = k; } else if (started) break;
  }
  return { head: L.slice(0, h).map(text), cols: withRoles(L[h]), notes: totEnd >= 0 ? L.slice(totEnd + 1).map(text) : [] };
}

// PPT：封面的文字當抬頭
const NS = { p: 'http://schemas.openxmlformats.org/presentationml/2006/main', a: 'http://schemas.openxmlformats.org/drawingml/2006/main', r: 'http://schemas.openxmlformats.org/officeDocument/2006/relationships' };
const REL_NS = 'http://schemas.openxmlformats.org/package/2006/relationships';
const CT_NS = 'http://schemas.openxmlformats.org/package/2006/content-types';
const REL_T = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/';
const parseXml = s => new DOMParser().parseFromString(s, 'application/xml');
const xmlStr = d => '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + new XMLSerializer().serializeToString(d).replace(/^<\?xml[^>]*\?>\s*/, '');
const relsPath = p => p.replace(/([^/]+)$/, '_rels/$1.rels');
const relsOf = doc => [...doc.getElementsByTagNameNS(REL_NS, 'Relationship')];
const aEls = (node, tag) => [...node.getElementsByTagNameNS(NS.a, tag)];
function resolvePath(base, target) {
  if (target.startsWith('/')) return target.slice(1);
  const parts = base.split('/').slice(0, -1);
  for (const seg of target.split('/')) { if (seg === '..') parts.pop(); else if (seg !== '.') parts.push(seg); }
  return parts.join('/');
}
async function slideOrder(zip) {
  const pres = parseXml(await zip.file('ppt/presentation.xml').async('string'));
  const presRels = parseXml(await zip.file('ppt/_rels/presentation.xml.rels').async('string'));
  const lst = pres.getElementsByTagNameNS(NS.p, 'sldIdLst')[0];
  const slides = lst ? [...lst.getElementsByTagNameNS(NS.p, 'sldId')].map(el => {
    const rid = el.getAttributeNS(NS.r, 'id');
    const rel = relsOf(presRels).find(x => x.getAttribute('Id') === rid);
    return { el, rel, path: resolvePath('ppt/presentation.xml', rel.getAttribute('Target')) };
  }) : [];

}
async function specFromPptx(buf) {
  const JSZip = await loadLib('jszip');
  let zip;
  try { zip = await JSZip.loadAsync(buf.slice(0)); } catch { throw new Error('這個 PPT 範本打不開，可能有密碼保護或檔案損毀。'); }
  if (!zip.file('ppt/presentation.xml')) throw new Error('這個檔案不是 PPT 簡報。');
  const { slides } = await slideOrder(zip);
  if (!slides.length) throw new Error('這個 PPT 範本沒有投影片。');
  const doc = parseXml(await zip.file(slides[0].path).async('string'));
  const paras = aEls(doc, 'p').map(p => aEls(p, 't').map(t => t.textContent).join('').trim()).filter(Boolean);
  return { head: paras.slice(0, 1), cols: [], notes: [], slides: slides.length };
}

// ---------- 產生 Excel ----------
// 欄寬單位是字元，約 7 像素一個，多留一格免得圖片超出
const pxToChars = px => Math.ceil(px / 7) + 1;
const colPx = (ws, c) => Math.round((ws.getColumn(c).width || ws.properties.defaultColWidth || 8.43) * 7 + 5);
// 圖片的左上和右下都綁在格子裡，列印縮放時會跟著儲存格一起縮；格子是合併的也可以
function placeAt(ws, col, span, row, w, h) {
  const widths = range(col, col + span - 1).map(c => colPx(ws, c));
  const total = widths.reduce((a, b) => a + b, 0);
  const rowPx = (ws.getRow(row).height || 15) / 0.75;
  const k = Math.min(1, (total - 4) / w, (rowPx - 4) / h);
  w = Math.round(w * k); h = Math.round(h * k);
  const x0 = (total - w) / 2, y = Math.max(0, Math.round((rowPx - h) / 2));
  const locate = x => { let c = 0; while (c < widths.length - 1 && x > widths[c]) { x -= widths[c]; c++; } return [col - 1 + c, Math.round(x)]; };
  const [tc, tx] = locate(x0), [bc, bx] = locate(x0 + w);
  return {
    tl: { nativeCol: tc, nativeColOff: tx * EMU, nativeRow: row - 1, nativeRowOff: y * EMU },
    br: { nativeCol: bc, nativeColOff: bx * EMU, nativeRow: row - 1, nativeRowOff: (y + h) * EMU },
  };
}

async function buildXlsx() {
  if (tpl?.kind === 'xlsx') return fillXlsxTemplate();
  const spec = currentSpec();
  const H = +$('size').value, PAD = 6, tax = $('qTax').value === '1';

  wb.calcProperties.fullCalcOnLoad = true; // 打開時算出金額
  const ws = wb.addWorksheet('估價單', { pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: .4, right: .4, top: .5, bottom: .5, header: .3, footer: .3 } } });
  const thin = { style: 'thin', color: { argb: 'FF9AA5A0' } };
  const box = { top: thin, left: thin, bottom: thin, right: thin };
  const money = '#,##0';
  const items = quoteItems(), prepared = await prepAll(items, H);
  const imgW = Math.max(H, ...prepared.filter(Boolean).map(p => p.w)) + PAD * 2;

  const cols = spec.cols, N = cols.length;
  const at = role => cols.findIndex(c => c.role === role) + 1;
  const cImg = at('image'), cQty = at('qty'), cPrice = at('price'), cAmt = at('amount');
  const L = colLetter;
  const COL_W = { index: 6, name: 24, spec: 22, size: 18, material: 16, qty: 7, unit: 6, price: 11, amount: 13, other: 14 };
  cols.forEach((c, i) => ws.getColumn(i + 1).width = c.role === 'image' ? pxToChars(imgW) : COL_W[c.role]);

  const totalChars = cols.reduce((a, c, i) => a + ws.getColumn(i + 1).width, 0);
  const wrapHeight = text => 15 * Math.max(1, Math.ceil(String(text).length * 2 / totalChars));

  const info = infoParts(spec);
  if (info.client || info.date) {
